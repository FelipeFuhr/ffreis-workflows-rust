---
# TEMPORARY PROBE — delete before this branch is proposed for merge.
#
# Settles three questions that decide whether the runner pod's
# CARGO_BUILD_JOBS can be made load-bearing again, instead of being silently
# overridden by every caller. Guessing here would put a wrong constant in 13
# workflow files, which is the exact failure the cargo-build-jobs comment
# already documents.
#
#   Q1 Does a job that declares no env at all inherit the POD's container env?
#   Q2 Does a $GITHUB_ENV write override a JOB-LEVEL env for later steps?
#   Q3 Does a $GITHUB_ENV write override an INHERITED CONTAINER env?
name: probe-env-precedence

"on":
  push:
    branches: [probe/env-precedence]

permissions:
  contents: read

jobs:
  q1-inherited-container-env:
    # Deliberately no `env:` block — whatever appears here came from the pod.
    runs-on: ["self-hosted", "local"]
    timeout-minutes: 5
    steps:
      - name: Q1 — what does the pod hand us?
        run: |
          echo "Q1 CARGO_BUILD_JOBS=[${CARGO_BUILD_JOBS:-<unset>}]"
          echo "Q1 CARGO_INCREMENTAL=[${CARGO_INCREMENTAL:-<unset>}]"
          echo "Q1 cgroup memory.max=[$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unreadable)]"
          echo "Q1 nproc=[$(nproc 2>/dev/null || echo unknown)]"

  q2-github-env-vs-job-env:
    runs-on: ["self-hosted", "local"]
    timeout-minutes: 5
    env:
      PROBE_VAR: from-job-level
    steps:
      - name: Write a different value to GITHUB_ENV
        run: echo "PROBE_VAR=from-github-env" >> "$GITHUB_ENV"
      - name: Q2 — which one wins in a later step?
        run: |
          echo "Q2 PROBE_VAR=[${PROBE_VAR}]"
          if [ "${PROBE_VAR}" = "from-github-env" ]; then
            echo "Q2 VERDICT: GITHUB_ENV overrides job-level env"
          else
            echo "Q2 VERDICT: job-level env WINS — GITHUB_ENV cannot override it"
          fi

  q3-github-env-vs-container-env:
    # Again no job-level `env:` for CARGO_BUILD_JOBS, so the only source is
    # the pod. Then we try to override it from a step.
    runs-on: ["self-hosted", "local"]
    timeout-minutes: 5
    steps:
      - name: Overwrite the pod-provided value
        run: echo "CARGO_BUILD_JOBS=99" >> "$GITHUB_ENV"
      - name: Q3 — did the override stick?
        run: |
          echo "Q3 CARGO_BUILD_JOBS=[${CARGO_BUILD_JOBS:-<unset>}]"
          if [ "${CARGO_BUILD_JOBS:-}" = "99" ]; then
            echo "Q3 VERDICT: GITHUB_ENV overrides inherited container env"
          else
            echo "Q3 VERDICT: container env WINS — a step cannot override it"
          fi

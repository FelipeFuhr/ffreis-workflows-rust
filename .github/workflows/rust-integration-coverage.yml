name: Rust Integration Coverage (cargo-llvm-cov + Codecov)

# Sibling of rust-coverage.yml, gated as a SEPARATE metric (not merged into
# unit coverage) so unit and integration floors can be enforced and tracked
# independently.
#
# Targets convention (a): `#[ignore]`-tagged integration tests run via
# `--include-ignored` in the same crate's `tests/` dir (see e.g. the
# rust-lambda project template and its consumers). A repo using convention
# (b) instead (a dedicated `integration-tests` workspace member) can still
# use this workflow unmodified — `--include-ignored` is a no-op for a crate
# with no ignored tests, and `--workspace` picks up the separate member
# automatically.

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain to use (must support llvm-tools-preview component)"
        type: string
        default: "stable"
      working-directory:
        description: "Directory containing the Cargo workspace"
        type: string
        default: "."
      coverage-args:
        description: "Arguments passed to cargo llvm-cov. Default runs --include-ignored so #[ignore]-tagged integration tests are exercised; --test-threads=1 avoids cross-test interference common in integration suites (shared DB/fixtures/env)."
        type: string
        default: "--all-features --workspace --lcov --output-path lcov-integration.info -- --include-ignored --test-threads=1"
      coverage-threshold:
        description: "Minimum line coverage percentage. 0 = no gate."
        type: number
        default: 0
      codecov-flags:
        description: "Flags passed to the Codecov upload"
        type: string
        default: "integration"
      sccache:
        description: "Enable sccache compiler caching (S3 backend)"
        type: boolean
        default: false
      sccache-bucket:
        description: "S3 bucket name for the sccache backend"
        type: string
        default: ""
      sccache-region:
        description: "AWS region of the sccache bucket"
        type: string
        default: "us-east-1"
      sccache-role-arn:
        description: "IAM role ARN assumed via OIDC for sccache S3 access"
        type: string
        default: ""
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'
      cargo-profile-debug:
        description: >-
          Sets CARGO_PROFILE_DEV_DEBUG — the dev profile's `debug` level, which
          the test profile inherits, so one value covers build and test.

          Default "line-tables-only" keeps panic backtraces (file/line still
          resolve) while dropping full DWARF, which is the single largest
          consumer of rustc and linker memory. Measured on ffreis-job-arbiter
          under a cgroup mirroring the runner pod, `cargo test --no-run`,
          jobs=2: 1931 MiB full debuginfo -> 1554 MiB line-tables-only, a 20%
          cut, with NO throughput cost.

          For contrast, capping parallelism — the knob this fleet has been
          tuning — bought 3% on the same build (jobs=1: 1872 MiB) while halving
          build concurrency, because peak is set by the single largest
          compilation unit, not by how many run at once. That is also why
          `cargo-build-jobs: 1` did not rescue ffreis-rust-shared at 2541 MB
          (99% of the 2.5Gi heavy tier) as this file's other comment records.

          Coverage is unaffected: cargo-llvm-cov uses instrumentation profiles,
          not DWARF. Verified byte-identical on ffreis-job-arbiter — 88.44%
          line / 87.35% region with and without.

          Pass "full" to restore complete debug info (a debugger or core-dump
          workflow), or "0" for the smallest possible footprint if you do not
          need backtraces.
        required: false
        type: string
        default: "line-tables-only"
      cargo-build-jobs:
        description: >-
          Caps CARGO_BUILD_JOBS (parallel rustc compile units). Default "2".

          Was "4", documented as memory-safe on a 4.5Gi self-hosted pod. That
          figure went stale — the heavy tier was resized 4.5Gi -> 2Gi -> 2.25Gi
          -> 2.5Gi and this comment was never updated, so callers inheriting it
          were silently over-committed. The symptom is not a build failure: the
          runner agent shares the pod cgroup, so IT dies, surfacing as "the
          self-hosted runner lost communication with the server" with no logs.

          Measured on ffreis-rust-shared under a cgroup mirroring the heavy pod
          (MemoryMax=2560M, no swap, 2 CPU): peak anon 2541 MB at jobs=1 —
          99% of the limit before any parallelism. Hosted-runner callers with
          real memory can pass a higher value (e.g. the runner's core count).
        type: string
        default: "2"
    secrets:
      CODECOV_TOKEN:
        required: false
      PRIVATE_DEPS_TOKEN:
        description: "Token with read access to private git-dependency repos (e.g. FLEET_READ_TOKEN). Optional — omit if the workspace has no private cargo git deps."
        required: false

jobs:
  integration-coverage:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Only used when `sccache` + `sccache-role-arn` are set, to mint an
      # OIDC token for the S3 cache backend. No-op otherwise.
      id-token: write
    # PUBLIC repos are FORCED onto GitHub-hosted runners, overriding `runner`.
    # A public repo accepts fork pull requests, and a self-hosted runner
    # executing fork-authored code would run arbitrary code on the homelab
    # cluster. This is the one case where honouring the caller's input would be
    # wrong. Private repos keep whatever `runner` says (default: self-hosted).
    # `github.event.repository.visibility` is populated for every trigger type
    # these workflows support — same mechanism tf-sonar.yml already uses.
    runs-on: ${{ github.event.repository.visibility == 'public' && fromJson('["ubuntu-latest"]') || fromJson(inputs.runner) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      # Keep rustup's home OFF the image's overlay lower layer.
      #
      # The runner image bakes a toolchain at /usr/local/rustup. When CI asks
      # for `stable` and upstream has moved, rustup tries to REPLACE the baked
      # components, which means renaming a directory that lives in a lower
      # overlayfs layer — and overlayfs answers EXDEV ("Invalid cross-device
      # link") for exactly that. rustup then rolls back and exits 1:
      #
      #   error: could not rename 'component' file from
      #   '/usr/local/rustup/toolchains/stable-.../share/doc/clippy'
      #   to '/usr/local/rustup/tmp/...': Invalid cross-device link (os error 18)
      #
      # It looks intermittent because a pod that survives one successful
      # update has copied-up and never fails again — only FRESH pods break. So
      # it surfaces after any Deployment roll, and `toolchain: 1.88.0` (the
      # MSRV, which matches what is baked) keeps passing while `stable` fails.
      #
      # Pointing RUSTUP_HOME at a writable path makes the install FRESH rather
      # than a replace, so no lower-layer rename happens. Cost: a minimal
      # toolchain download per pod (the action already passes
      # `--profile minimal`). That is the deliberate trade — a predictable
      # ~30-60s against a failure that is invisible until it isn't.
      #
      # It also means CI no longer depends on the image's baked toolchain at
      # all, which is the answer to "should the image bake one?": it should
      # not, and this is what makes removing it safe.
      RUSTUP_HOME: /tmp/rustup-ci
      CARGO_BUILD_JOBS: ${{ inputs.cargo-build-jobs }}
      CARGO_PROFILE_DEV_DEBUG: ${{ inputs.cargo-profile-debug }}

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4

      - name: Configure git for private cargo dependencies
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$PRIVATE_DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            # cargo's libgit2 backend does not reliably honor url.insteadOf
            # credential rewriting; force it to shell out to system git,
            # which does.
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ inputs.toolchain }}
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: "${{ inputs.working-directory }} -> target"

      - name: Configure AWS credentials for sccache
        if: ${{ inputs.sccache && inputs.sccache-role-arn != '' }}
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ inputs.sccache-role-arn }}
          aws-region: ${{ inputs.sccache-region }}

      - name: Set up sccache
        if: ${{ inputs.sccache }}
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Enable sccache
        if: ${{ inputs.sccache }}
        env:
          SCCACHE_BUCKET: ${{ inputs.sccache-bucket }}
          SCCACHE_REGION: ${{ inputs.sccache-region }}
          SCCACHE_S3_KEY_PREFIX: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_BUCKET=${SCCACHE_BUCKET}"
            echo "SCCACHE_REGION=${SCCACHE_REGION}"
            echo "SCCACHE_S3_KEY_PREFIX=${SCCACHE_S3_KEY_PREFIX}"
          } >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov
        # Prebuilt binary (no from-source compile per run).
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2.81.3
        with:
          tool: cargo-llvm-cov

      - name: Generate integration coverage report
        env:
          COVERAGE_ARGS: ${{ inputs.coverage-args }}
        run: |
          set -euo pipefail
          read -r -a coverage_args_arr <<< "${COVERAGE_ARGS:-}"
          cargo llvm-cov "${coverage_args_arr[@]}"

      - name: sccache stats
        if: ${{ inputs.sccache }}
        run: sccache --show-stats

      - name: Enforce integration coverage threshold
        if: ${{ inputs.coverage-threshold > 0 }}
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          set -euo pipefail
          # Parse line coverage percentage from the lcov summary
          COVERED=$(grep -E -c '^DA:[0-9]+,[1-9][0-9]*$' lcov-integration.info || true)
          TOTAL=$(grep -E -c '^DA:' lcov-integration.info || true)
          if [[ "$TOTAL" -eq 0 ]]; then
            echo "::error::No coverage data found in lcov-integration.info"
            exit 1
          fi
          PCT=$(awk "BEGIN { printf \"%.1f\", ($COVERED / $TOTAL) * 100 }")
          echo "Integration line coverage: ${PCT}% (threshold: ${THRESHOLD}%)"
          awk "BEGIN { exit (${PCT} < ${THRESHOLD}) ? 1 : 0 }" || {
            echo "::error::Integration coverage ${PCT}% is below the required threshold of ${THRESHOLD}%"
            exit 1
          }

      - name: Check Codecov token availability
        id: codecov_gate
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CODECOV_TOKEN" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::error::CODECOV_TOKEN secret is required for push coverage uploads."
              exit 1
            fi
            echo "CODECOV_TOKEN not available (likely fork PR); skipping upload."
            echo "skip_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        if: steps.codecov_gate.outputs.skip_upload != 'true'
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-integration.info
          flags: ${{ inputs.codecov-flags }}
          fail_ci_if_error: true
          verbose: true

name: Rust SonarCloud

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain to use"
        type: string
        default: "stable"
      working-directory:
        description: "Directory containing the Cargo workspace"
        type: string
        default: "."
      sonar-project-key:
        description: "SonarCloud project key (defaults to repository name)"
        type: string
        default: ""
      sonar-organization:
        description: "SonarCloud organization slug"
        type: string
        default: ""
      coverage-args:
        description: "Arguments passed to cargo llvm-cov to generate LCOV report"
        type: string
        default: "--all-features --workspace --lcov --output-path lcov.info"
      coverage-artifact-name:
        description: "Name of a coverage artifact uploaded by rust-coverage.yml (skips regeneration)"
        type: string
        default: ""
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'
      cargo-build-jobs:
        description: >-
          Caps CARGO_BUILD_JOBS (parallel rustc compile units) for the
          coverage-instrumented build. Default "4" matches the workspace
          Makefile convention — memory-safe on a 4.5Gi-limited self-hosted
          runner pod. Hosted-runner callers wanting full parallelism can pass
          a higher value (e.g. the runner's core count).
        type: string
        default: "4"
    secrets:
      PRIVATE_DEPS_TOKEN:
        description: "Token with read access to private git-dependency repos (e.g. FLEET_READ_TOKEN). Optional — omit if the workspace has no private cargo git deps."
        required: false
      SONAR_TOKEN:
        required: true

jobs:
  sonar:
    timeout-minutes: 30
    name: SonarCloud
    permissions:
      contents: read
    runs-on: ${{ fromJson(inputs.runner) }}
    if: vars.SONAR_ENABLED == 'true'

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      CARGO_BUILD_JOBS: ${{ inputs.cargo-build-jobs }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve Sonar target
        # SonarCloud's free tier only scans PUBLIC repos (private = 403,
        # confirmed live — same fix already applied in tf-sonar.yml). Private
        # repos route to the self-hosted SonarQube server ffreis-home-infra's
        # `sonarqube` role deploys into the same cluster this job runs on
        # (scale-to-zero — see that role's README).
        id: target
        run: |
          set -euo pipefail
          if [[ "${{ github.event.repository.visibility }}" == "public" ]]; then
            echo "host_url=https://sonarcloud.io" >> "$GITHUB_OUTPUT"
            echo "is_local=false" >> "$GITHUB_OUTPUT"
          else
            echo "host_url=http://sonarqube.ci.svc.cluster.local:9000" >> "$GITHUB_OUTPUT"
            echo "is_local=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kubectl (local SonarQube routing only)
        if: steps.target.outputs.is_local == 'true'
        run: |
          set -euo pipefail
          krel="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLO "https://dl.k8s.io/release/${krel}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${krel}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Scale up local SonarQube and wait for readiness
        # RBAC for this is the `sonarqube-scaler` Role in ffreis-home-infra's
        # sonarqube role, bound to this runner pod's own `default`
        # ServiceAccount (its token is already mounted by k8s default
        # behavior — nothing extra to configure here) — scoped to get+patch
        # on exactly the one named Deployment `sonarqube`, nothing else.
        if: steps.target.outputs.is_local == 'true'
        run: |
          set -euo pipefail
          kc=(kubectl --server=https://kubernetes.default.svc
              --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              -n ci)

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          "${kc[@]}" patch deployment sonarqube --type=merge -p \
            "{\"spec\":{\"replicas\":1},\"metadata\":{\"annotations\":{\"sonarqube.ffreis/last-scaled-up\":\"${now}\"}}}"

          # Cold-boot budget matches ffreis-home-infra's own
          # sonarqube_ready_timeout_seconds default (see that role's
          # defaults/main.yml for the reasoning) — kept in sync manually,
          # both are small homelab-scoped constants.
          echo "waiting for sonarqube to become ready..."
          deadline=$(( $(date +%s) + 360 ))
          until [[ "$("${kc[@]}" get deployment sonarqube -o jsonpath='{.status.readyReplicas}')" == "1" ]]; do
            if [[ $(date +%s) -ge $deadline ]]; then
              echo "::error::sonarqube did not become ready within 360s" >&2
              exit 1
            fi
            sleep 5
          done
          echo "sonarqube ready"

      - name: Configure git for private cargo dependencies
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$PRIVATE_DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            # cargo's libgit2 backend does not reliably honor url.insteadOf
            # credential rewriting; force it to shell out to system git,
            # which does.
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi

      - name: Install Rust (${{ inputs.toolchain }})
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ inputs.toolchain }}
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: "${{ inputs.working-directory }} -> target"

      - name: Download coverage artifact
        if: inputs.coverage-artifact-name != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.working-directory }}

      - name: Install cargo-llvm-cov (if no artifact)
        if: inputs.coverage-artifact-name == ''
        run: |
          set -euo pipefail
          cargo install cargo-llvm-cov --locked

      - name: Generate coverage (if no artifact)
        if: inputs.coverage-artifact-name == ''
        env:
          COVERAGE_ARGS: ${{ inputs.coverage-args }}
        run: |
          set -euo pipefail
          read -r -a coverage_args_arr <<< "${COVERAGE_ARGS:-}"
          cargo llvm-cov "${coverage_args_arr[@]}"

      - name: Build Sonar extra args
        id: sonar-args
        env:
          # scan-fix(ci:sonar-org-precedence-dead-code): the old single-expression
          # fallback (`inputs... || vars... || github.repository_owner`) baked the
          # repo-owner default in at the GHA-expression level, so PROJECT_KEY/
          # ORGANIZATION were NEVER empty by the time the shell ran — the
          # `-z "$ORGANIZATION" && -f sonar-project.properties` check below was
          # dead code, and a repo whose SonarCloud project lives under a
          # different org than its current GitHub owner (e.g. a repo migrated
          # from ffreis-org to FelipeFuhr, SonarCloud project left at
          # organization=ffreis-org) always got the wrong org silently — same
          # bug confirmed and fixed in python-sonar.yml. Split each fallback
          # into its own shell-level check (matching go-sonar.yml) so the
          # properties-file value is genuinely consulted before falling back to
          # repo-owner-derived defaults.
          PROJECT_KEY_INPUT: ${{ inputs.sonar-project-key }}
          PROJECT_KEY_VAR: ${{ vars.SONAR_PROJECT_KEY }}
          ORGANIZATION_INPUT: ${{ inputs.sonar-organization }}
          ORGANIZATION_VAR: ${{ vars.SONAR_ORGANIZATION }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          IS_LOCAL: ${{ steps.target.outputs.is_local }}
        run: |
          set -euo pipefail
          PROJECT_KEY="${PROJECT_KEY_INPUT:-}"
          [ -z "$PROJECT_KEY" ] && PROJECT_KEY="${PROJECT_KEY_VAR:-}"
          if [[ -z "$PROJECT_KEY" && -f sonar-project.properties ]]; then
            PROJECT_KEY="$(grep -E '^sonar[.]projectKey=' sonar-project.properties | head -n 1 | cut -d= -f2- || true)"
          fi
          [ -z "$PROJECT_KEY" ] && PROJECT_KEY="${OWNER}_${REPO}"

          ORGANIZATION="${ORGANIZATION_INPUT:-}"
          [ -z "$ORGANIZATION" ] && ORGANIZATION="${ORGANIZATION_VAR:-}"
          if [[ -z "$ORGANIZATION" && -f sonar-project.properties ]]; then
            ORGANIZATION="$(grep -E '^sonar[.]organization=' sonar-project.properties | head -n 1 | cut -d= -f2- || true)"
          fi
          [ -z "$ORGANIZATION" ] && ORGANIZATION="$OWNER"

          EXTRA=""
          [ -n "$PROJECT_KEY" ] && EXTRA="$EXTRA -Dsonar.projectKey=$PROJECT_KEY"
          # "organization" is a SonarCloud multi-tenancy concept — self-hosted
          # SonarQube Community Edition rejects the -Dsonar.organization
          # argument outright, so it must be omitted entirely for local scans.
          if [[ "$IS_LOCAL" != "true" && -n "$ORGANIZATION" ]]; then
            EXTRA="$EXTRA -Dsonar.organization=$ORGANIZATION"
          fi
          echo "args=$EXTRA" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.target.outputs.host_url }}
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: >
            ${{ steps.sonar-args.outputs.args }}
            -Dsonar.rust.lcov.reportPaths=lcov.info
            -Dsonar.sources=src

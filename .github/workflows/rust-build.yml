name: Rust Matrix Build

on:
  workflow_call:
    inputs:
      rust-versions:
        description: "JSON array of Rust toolchain versions to build against"
        type: string
        default: '["stable","1.88.0"]'
      os-list:
        description: "JSON array of runner OS labels to build on"
        type: string
        # COST GUARD: default is Linux-only. macOS Actions minutes bill 10x;
        # callers opt in by passing os-list (e.g. a manual workflow_dispatch).
        # Do NOT add "macos-latest" to this default — it hits every caller's
        # push/PR flow at 10x (CI cost incident 2026-06).
        default: '["self-hosted","local"]'
      working-directory:
        description: "Directory containing the Cargo workspace"
        type: string
        default: "."
      cargo-args:
        description: >-
          Package-selection args placed BEFORE build-args (e.g. "-p crate" or
          "--workspace"). Used to scope the build to affected crates via
          rust-affected.yml's cargo-args output. Empty = whatever build-args
          specifies.
        type: string
        default: ""
      build-args:
        description: "Extra arguments passed to cargo build"
        type: string
        default: "--release"
      build-wrapper:
        description: >-
          Optional command prefix wrapping the `cargo build` invocation, e.g.
          "buildguard run --profile rust --no-slot --" to confine the build in
          a memory-limited cgroup on a memory-constrained self-hosted runner.
          Empty (default) runs cargo directly, so GitHub-hosted callers are
          unaffected. The wrapper binary must already exist on the runner. See
          ffreis-home-infra ansible/roles/gha_runner/README.md "buildguard".
        type: string
        default: ""
      sccache:
        description: "Enable sccache compiler caching (S3 backend)"
        type: boolean
        default: false
      sccache-bucket:
        description: "S3 bucket name for the sccache backend"
        type: string
        default: ""
      sccache-region:
        description: "AWS region of the sccache bucket"
        type: string
        default: "us-east-1"
      sccache-role-arn:
        description: "IAM role ARN assumed via OIDC for sccache S3 access"
        type: string
        default: ""
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      cargo-profile-debug:
        description: >-
          Sets CARGO_PROFILE_DEV_DEBUG — the dev profile's `debug` level, which
          the test profile inherits, so one value covers build and test.

          Default "line-tables-only" keeps panic backtraces (file/line still
          resolve) while dropping full DWARF, which is the single largest
          consumer of rustc and linker memory. Measured on ffreis-job-arbiter
          under a cgroup mirroring the runner pod, `cargo test --no-run`,
          jobs=2: 1931 MiB full debuginfo -> 1554 MiB line-tables-only, a 20%
          cut, with NO throughput cost.

          For contrast, capping parallelism — the knob this fleet has been
          tuning — bought 3% on the same build (jobs=1: 1872 MiB) while halving
          build concurrency, because peak is set by the single largest
          compilation unit, not by how many run at once. That is also why
          `cargo-build-jobs: 1` did not rescue ffreis-rust-shared at 2541 MB
          (99% of the 2.5Gi heavy tier) as this file's other comment records.

          Coverage is unaffected: cargo-llvm-cov uses instrumentation profiles,
          not DWARF. Verified byte-identical on ffreis-job-arbiter — 88.44%
          line / 87.35% region with and without.

          Pass "full" to restore complete debug info (a debugger or core-dump
          workflow), or "0" for the smallest possible footprint if you do not
          need backtraces.
        required: false
        type: string
        default: "line-tables-only"
      cargo-build-jobs:
        description: >-
          Caps CARGO_BUILD_JOBS (parallel rustc compile units).
          Default "auto" — derived from the runner pod's real cgroup memory
          limit at job start, so a tier resize cannot silently over-commit
          callers. Pass an explicit number to override (it always wins).

          Was "4", documented as memory-safe on a 4.5Gi self-hosted pod. That
          figure went stale — the heavy tier was resized 4.5Gi -> 2Gi -> 2.25Gi
          -> 2.5Gi -> 3Gi and this comment was never updated, so callers
          inheriting it were silently over-committed. Deriving it is what stops
          that recurring. The symptom is not a build failure: the runner agent
          shares the pod cgroup, so IT dies, surfacing as "the self-hosted
          runner lost communication with the server" with no logs.

          Measured on ffreis-rust-shared under a cgroup mirroring the heavy pod
          (MemoryMax=2560M, no swap, 2 CPU): peak anon 2541 MB at jobs=1 —
          99% of the limit before any parallelism. Memory is therefore
          dominated by a per-crate baseline, not linear in job count; a crate
          whose baseline alone exceeds the pod needs a bigger tier, not a
          smaller cap. Hosted-runner callers with real memory can pass a
          higher value (e.g. the runner's core count).
        type: string
        default: "auto"
    secrets:
      PRIVATE_DEPS_TOKEN:
        description: "Token with read access to private git-dependency repos (e.g. FLEET_READ_TOKEN). Optional — omit if the workspace has no private cargo git deps."
        required: false

jobs:
  build:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Only used when `sccache` + `sccache-role-arn` are set, to mint an
      # OIDC token for the S3 cache backend. No-op otherwise.
      id-token: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        rust: ${{ fromJson(inputs.rust-versions) }}
        os: ${{ fromJson(inputs.os-list) }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      # Keep rustup's home OFF the image's overlay lower layer.
      #
      # The runner image bakes a toolchain at /usr/local/rustup. When CI asks
      # for `stable` and upstream has moved, rustup tries to REPLACE the baked
      # components, which means renaming a directory that lives in a lower
      # overlayfs layer — and overlayfs answers EXDEV ("Invalid cross-device
      # link") for exactly that. rustup then rolls back and exits 1:
      #
      #   error: could not rename 'component' file from
      #   '/usr/local/rustup/toolchains/stable-.../share/doc/clippy'
      #   to '/usr/local/rustup/tmp/...': Invalid cross-device link (os error 18)
      #
      # It looks intermittent because a pod that survives one successful
      # update has copied-up and never fails again — only FRESH pods break. So
      # it surfaces after any Deployment roll, and `toolchain: 1.88.0` (the
      # MSRV, which matches what is baked) keeps passing while `stable` fails.
      #
      # Pointing RUSTUP_HOME at a writable path makes the install FRESH rather
      # than a replace, so no lower-layer rename happens. Cost: a minimal
      # toolchain download per pod (the action already passes
      # `--profile minimal`). That is the deliberate trade — a predictable
      # ~30-60s against a failure that is invisible until it isn't.
      #
      # The PATH MATTERS, and /tmp is the wrong one. In this fleet's runner
      # pods /tmp is an emptyDir with `sizeLimit: 2Gi`, and a toolchain is
      # ~2Gi — so a first attempt at this evicted the pod outright:
      #   Evicted: Usage of EmptyDir volume "tmp" exceeds the limit "2Gi"
      # which surfaces, again, as "the self-hosted runner lost communication".
      # /home/runner/_work is the `work` emptyDir at 8Gi, the only mount with
      # room. It is shared with the build's target/ dir, so a repo whose
      # target/ approaches 6Gi will need that limit raised rather than this
      # path changed.
      #
      # It also means CI no longer depends on the image's baked toolchain at
      # all, which is the answer to "should the image bake one?": it should
      # not, and this is what makes removing it safe.
      RUSTUP_HOME: /home/runner/_work/_temp/rustup-ci
      CARGO_PROFILE_DEV_DEBUG: ${{ inputs.cargo-profile-debug }}

    steps:
      # Resolve build parallelism BEFORE anything invokes cargo.
      #
      # This step is the single authority: a $GITHUB_ENV write beats both a
      # job-level `env:` and the value inherited from the runner pod's
      # container env (both measured on a real runner, 2026-08-21). So no
      # `CARGO_BUILD_JOBS` is declared at job level any more — if this step
      # were ever skipped, the pod's own value applies, which is a safe
      # fallback rather than an unset variable.
      #
      # `auto` derives the cap from the pod's REAL cgroup memory limit, so a
      # tier resize no longer silently over-commits every caller. That is the
      # failure this replaces: the previous constant ("4", documented as
      # memory-safe on a 4.5Gi pod) was never updated as the tier went
      # 4.5Gi -> 2Gi -> 2.25Gi -> 2.5Gi -> 3Gi, and the symptom is not a build
      # error — the runner agent shares the pod cgroup, so IT dies and the job
      # surfaces as "the self-hosted runner lost communication" with no logs.
      #
      # ~1 GiB per compile unit is deliberately conservative and is a CEILING,
      # not a target: measured peak on ffreis-rust-shared was 2541 MB at
      # jobs=1 (99% of a 2560M limit), i.e. memory is dominated by a
      # per-crate baseline rather than being linear in job count. No formula
      # can rescue a crate whose baseline alone exceeds the pod — those pass
      # an explicit number, which always wins over `auto`.
      - name: Resolve build parallelism
        # Pinned to the workspace root: this step runs BEFORE checkout, so the
        # job's default working-directory (the caller's `working-directory`
        # input, e.g. examples/hello) does not exist yet and bash cannot even
        # start. Caught by CI on the first run of this change.
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED: ${{ inputs.cargo-build-jobs }}
        run: |
          set -euo pipefail
          if [ "${REQUESTED}" != "auto" ]; then
            echo "CARGO_BUILD_JOBS=${REQUESTED}" >> "$GITHUB_ENV"
            echo "build parallelism: ${REQUESTED} (explicit caller override)"
            exit 0
          fi
          # The path is a seam so this can be tested against fixtures — the
          # workspace's "inject IO, never real IO in a tested path" rule.
          # Production never sets it.
          limit="$(cat "${CGROUP_MEMORY_MAX_PATH:-/sys/fs/cgroup/memory.max}" 2>/dev/null || echo max)"
          cpus="$(nproc 2>/dev/null || echo 2)"
          # "max" means unlimited (hosted runners, or cgroup v1 layouts where
          # this file is absent). Never guess a big number from an unreadable
          # limit — fall back to the value this input used to hardcode.
          if [ "${limit}" = "max" ] || ! printf '%s' "${limit}" | grep -qE '^[0-9]+$'; then
            jobs=2
            why="cgroup limit unreadable or unlimited; safe fallback"
          else
            gib=$(( limit / 1073741824 ))
            [ "${gib}" -lt 1 ] && gib=1
            jobs="${gib}"
            [ "${jobs}" -gt "${cpus}" ] && jobs="${cpus}"
            why="${gib}GiB pod memory limit, ${cpus} cpu"
          fi
          echo "CARGO_BUILD_JOBS=${jobs}" >> "$GITHUB_ENV"
          echo "build parallelism: ${jobs} (${why})"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure git for private cargo dependencies
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$PRIVATE_DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            # cargo's libgit2 backend does not reliably honor url.insteadOf
            # credential rewriting; force it to shell out to system git,
            # which does.
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ matrix.rust }}

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: "${{ inputs.working-directory }} -> target"

      - name: Configure AWS credentials for sccache
        if: ${{ inputs.sccache && inputs.sccache-role-arn != '' }}
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ inputs.sccache-role-arn }}
          aws-region: ${{ inputs.sccache-region }}

      - name: Set up sccache
        if: ${{ inputs.sccache }}
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Enable sccache
        if: ${{ inputs.sccache }}
        env:
          SCCACHE_BUCKET: ${{ inputs.sccache-bucket }}
          SCCACHE_REGION: ${{ inputs.sccache-region }}
          SCCACHE_S3_KEY_PREFIX: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_BUCKET=${SCCACHE_BUCKET}"
            echo "SCCACHE_REGION=${SCCACHE_REGION}"
            echo "SCCACHE_S3_KEY_PREFIX=${SCCACHE_S3_KEY_PREFIX}"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          CARGO_ARGS: ${{ inputs.cargo-args }}
          BUILD_ARGS: ${{ inputs.build-args }}
          BUILD_WRAPPER: ${{ inputs.build-wrapper }}
        run: |
          set -euo pipefail
          read -r -a cargo_args_arr <<< "${CARGO_ARGS:-}"
          read -r -a build_args_arr <<< "${BUILD_ARGS:-}"
          read -r -a wrapper_arr <<< "${BUILD_WRAPPER:-}"
          # Library crates in this fleet gitignore Cargo.lock (only
          # binaries/Lambdas commit it); only pass --locked when one exists so
          # library repos don't fail resolving a lockfile that was never
          # committed.
          locked_arr=()
          [ -f Cargo.lock ] && locked_arr=("--locked")
          # A build-wrapper (e.g. buildguard) confines the compile in a
          # memory-limited cgroup on a constrained self-hosted runner; empty
          # by default so GitHub-hosted builds run cargo directly.
          if [[ ${#wrapper_arr[@]} -gt 0 ]]; then
            "${wrapper_arr[@]}" cargo build "${locked_arr[@]}" "${cargo_args_arr[@]}" "${build_args_arr[@]}"
          else
            cargo build "${locked_arr[@]}" "${cargo_args_arr[@]}" "${build_args_arr[@]}"
          fi

      - name: sccache stats
        if: ${{ inputs.sccache }}
        run: sccache --show-stats

name: Self Test

on:
  push:
    branches: [main]

# Validates that every workflow defined in this library functions correctly
# against the minimal example app in examples/hello/.
#
# rust-sonar requires SONAR_TOKEN to be configured in the repository. The job
# is skipped on fork pull requests (secrets are not available to forks), but
# runs on all other events and fails if the token is absent.
#
# rust-coverage and rust-integration-coverage treat CODECOV_TOKEN as fully
# optional on every trigger, push included: when the token is missing, the
# upload step is skipped with a log line instead of failing the job (the
# workflow_call secrets block declares it `required: false`). This self-test
# workflow does not pass CODECOV_TOKEN through, so its own coverage /
# integration-coverage jobs exercise that skip path on every push to main.
#
# rust-miri uses --lib to avoid compiling the Criterion benchmark harness
# under Miri (Criterion uses features incompatible with the Miri interpreter).
#
# All jobs below pin runner (or os-list, for rust-build.yml) explicitly to
# ubuntu-latest: this repo is PUBLIC, so self-hosted runners are structurally
# unavailable (GitHub blocks them by default on public repos, and the fleet's
# self-hosted pool is org-scoped to ffreis-org anyway) even though the
# reusable workflows now default that input to self-hosted for fleet
# consumers. Without an explicit override here, these jobs queue forever.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows-policy:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-workflows-policy.yml@287f836a726a35af37bd24561fc687f66eaeb92f # v1.7.0

  codeql-actions:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@287f836a726a35af37bd24561fc687f66eaeb92f # v1.7.0
    with:
      languages: actions
      source-root: .
      upload-sarif: false
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  fmt:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-fmt.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  lint:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-lint.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  quick-checks:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-quick-checks.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  affected:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-affected.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  test:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-test.yml
    with:
      working-directory: examples/hello
      # Exercise the nextest path (incl. the separate doctest run) so a
      # regression in that branch breaks self-test, not a downstream caller.
      nextest: true
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  build:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-build.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable. rust-build.yml's
      # runner-selection input is named os-list (matrix), not runner — pin
      # explicitly, same reason as the runner: overrides above.
      os-list: '["ubuntu-latest"]'

  docs:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-docs.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  security:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-security.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  deny:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-deny.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  coverage:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-coverage.yml
    with:
      working-directory: examples/hello
      # examples/hello is a 187-LOC validator with comprehensive tests;
      # it should comfortably exceed 80. Gating here exercises the
      # coverage-threshold input itself so a regression in that input
      # would break self-test instead of silently shipping to downstream
      # callers.
      coverage-threshold: 80
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  integration-coverage:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-integration-coverage.yml
    with:
      working-directory: examples/hello
      # examples/hello has no #[ignore]-tagged tests, so --include-ignored
      # is a no-op here — this self-test only exercises the workflow
      # plumbing (lcov-integration.info generation, threshold-parsing
      # logic, Codecov "integration" flag), not a real convention-(a)
      # integration suite. coverage-threshold: 0 keeps this a smoke test
      # instead of a spurious failure with nothing ignored to count.
      coverage-threshold: 0
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  bench:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-bench.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  msrv:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-msrv.yml
    with:
      msrv: "1.88.0"
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  miri:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-miri.yml
    with:
      working-directory: examples/hello
      miri-args: --lib
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  mutation:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-mutation.yml
    with:
      working-directory: examples/hello
      # examples/hello is small enough that mutation should easily exceed
      # 80; the previous 50 was too permissive to detect regressions in
      # the mutation gating logic itself.
      threshold: 80
      # Deliberately the UNSHARDED path (shard-count: 1) — this job and
      # mutation-measures-real-outcomes below together exercise BOTH code
      # paths in self-test: this one covers the pre-sharding single-job
      # shape, the other (left at the default shard-count) covers the
      # matrix + mutation-aggregate summing path against a fixture with a
      # KNOWN non-100 expected score.
      shard-count: 1
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  # REGRESSION GUARD for the vacuous-mutation-gate bug (fixed 2026-08-19).
  #
  # The job above cannot detect that class of bug: examples/hello is fully
  # tested, so it scores 100 whether the harness measures anything or not.
  # examples/partial leaves shrink_to_fit_len() untested on purpose and scores
  # 50 when the harness works — versus exactly 100 when it is silently reading
  # no results at all. threshold: 0 because this pair MEASURES the harness
  # rather than gating the fixture; the real assertion is the job below.
  mutation-measures-real-outcomes:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-mutation.yml
    with:
      working-directory: examples/partial
      threshold: 0
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  assert-mutation-not-vacuous:
    name: Mutation gate must measure real outcomes
    needs: [mutation-measures-real-outcomes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Score must reflect the fixture's surviving mutants
        env:
          SCORE: ${{ needs.mutation-measures-real-outcomes.outputs.mutation-score }}
        run: |
          set -euo pipefail

          if [[ -z "${SCORE:-}" ]]; then
            echo "::error title=Vacuous mutation gate::the mutation workflow produced no score output at all."
            exit 1
          fi

          # A harness that never reads real cargo-mutants results reports
          # exactly 100 via the total==0 branch. examples/partial has
          # deliberately untested code, so a working harness cannot.
          if [[ "$SCORE" -ge 100 ]]; then
            echo "::error title=Vacuous mutation gate::examples/partial leaves shrink_to_fit_len() untested, so a working harness must score below 100 — got ${SCORE}. The scorer is not reading real cargo-mutants outcomes, which means the mutation gate cannot fail on ANY consumer repo."
            exit 1
          fi

          # And the tested half must still be caught, or the fixture has
          # decayed into "everything survives" and proves nothing either.
          if [[ "$SCORE" -le 0 ]]; then
            echo "::error title=Mutation fixture broken::score ${SCORE} means nothing was caught; clamp_between() is tested and its mutants should be."
            exit 1
          fi

          echo "Mutation harness verified end-to-end: real score ${SCORE}% on examples/partial."

  proptest:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-proptest.yml
    with:
      working-directory: examples/hello
      # Low case count for the self-test (examples/hello has no real
      # property tests yet — the workflow emits a warning + skips if it
      # finds no proptest! macros, so this is mostly testing the workflow
      # plumbing itself).
      proptest-cases: 256
      timeout-minutes: 10
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  semgrep:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-semgrep.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'

  sonar:
    if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    permissions:
      contents: read
    uses: ./.github/workflows/rust-sonar.yml
    with:
      working-directory: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly.
      runner: '["ubuntu-latest"]'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  container:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-container.yml
    with:
      image-name: hello-example
      context: examples/hello
      # Public repo: self-hosted structurally unavailable — pin explicitly
      # (rust-container.yml's default is still ubuntu-latest, but pin
      # anyway for consistency and to survive a future default change).
      runner: '["ubuntu-latest"]'

name: Rust Mutation Testing

# Reusable workflow — callers invoke via:
#   uses: ./.github/workflows/rust-mutation.yml
#
# Intended schedule: weekly (Sunday 02:00 UTC) or workflow_dispatch.
# Do NOT run on every PR — mutation testing is slow (15–90 min per repo).
#
# Exit behaviour:
#   - exit 0  → mutation score ≥ threshold   (pass)
#   - exit 1  → mutation score  < threshold  (fail CI)
#
# Job topology (sharding, added 2026-08-23; `mutation-warm` added later — see
# that job's own comment below): `mutation` is a matrix over `shard-count`
# shards (default 4 — see that input for the evidence). Each shard
# independently discovers the same mutant set (`cargo mutants --shard k/n`)
# and uploads its own outcome files as artifact `mutants-report-shard-<k>`. A
# separate `mutation-aggregate` job downloads every shard's artifact, sums
# caught/missed/timeout/unviable across ALL of them, and enforces
# `threshold` exactly ONCE against the combined total — never per shard, so
# a shard boundary can never let a below-threshold crate through and can
# never fail a shard for mutants that live entirely in a different shard.
# `outputs.mutation-score` is sourced from that aggregate job, not from any
# individual shard.
#
# IMPORTANT — what sharding is (and is not) fixing here, and CORRECTED here
# from an earlier version of this comment that asserted max_replicas: 1 and
# reasoned entirely from that. This fleet's self-hosted "heavy" runner class
# — where this job runs by default, see the `runner` input — is capped at
# max_replicas: 3, not 1 (platform/ffreis-home-infra ansible role
# job_arbiter, `ci-build` class, defaults/main.yml). That cap moved twice,
# and the file's own comments there say why: 1 -> 2 on 2026-09-08 ("`max_replicas: 1`
# made this tier a SINGLE POINT OF STARVATION" — an ephemeral runner's
# exit-0-then-backoff cycle left zero heavy runners registered for windows
# of up to ~5 minutes, observed live with `gha-runner-heavy 0/1 1 0` while
# `gha-runner-light` sat healthy at `3/3`), then 2 -> 3 on 2026-09-23
# ("RAISED 2 -> 3 ... ffreis-rust-shared run 35908552119 ran four mutation
# shards STRICTLY SERIALLY — each starting within two seconds of the
# previous one finishing, 3.5 hours end to end, last shard cancelled
# unfinished. A cap of 2 was not the whole reason ..., but it is the ceiling
# that would have bound next."). Two shards were observed running
# CONCURRENTLY on run 36678132846.
#
# So sharding now buys REAL parallelism, up to 3 concurrent shards, not only
# the job-size bound the earlier version of this comment claimed. It is
# still bounded, not unlimited: with the `shard-count` default of 4 below,
# 3 shards run at once and the 4th queues behind them rather than all 4
# serializing — see that input's own description for why 4 is kept rather
# than lowered to 3 now that the cap matches. `timeout-minutes` and
# job-arbiter's 90-min stale-job reaper still bound any single shard's own
# runtime regardless of how many run concurrently. It is also still not a
# full wall-clock fix on its own — splitting one crate's mutation run N ways
# still costs roughly N× the fixed per-shard overhead (checkout, toolchain
# install, baseline test run), now largely paid CONCURRENTLY rather than
# serially, but not eliminated. The lever that actually reduces the WORK
# (not just how many jobs it's spread across) is the `in-diff` input, below
# — prefer that for PR-triggered runs; reserve a wide shard-count for the
# full/scheduled sweep that recovers whole-crate coverage.
#
# `mutants-fail-fast` (added after 2026-08-29): strategy.fail-fast for the
# shard matrix, default false — see that input's own description, corrected
# alongside this comment, for what fail-fast still buys and does not under
# max_replicas: 3.

on:
  workflow_call:
    inputs:
      toolchain:
        description: 'Rust toolchain to use'
        required: false
        type: string
        default: 'stable'
      working-directory:
        description: 'Directory containing Cargo.toml (workspace or package root)'
        required: false
        type: string
        default: '.'
      threshold:
        description: 'Minimum mutation score (0–100). CI fails if caught% is below this.'
        required: false
        type: number
        default: 60
      jobs:
        description: >-
          Parallel mutant workers (each worker builds AND tests one mutant, so
          one worker costs a FULL crate build).

          0 (the default) means DERIVE IT from the pod's real memory budget via
          the ci-budget action, using `mutant-worker-mib` as the per-worker
          cost. Any positive number is an explicit caller override and is used
          verbatim.

          The old default was 4, a constant. That is the input that has
          OOM-killed this job across the fleet, because the number that fits is
          a property of the crate's DEPENDENCY CLOSURE and the pod's limit, not
          something a caller can know when scaffolding. Measured on this fleet:
          ~2500 MiB peak per worker for an aws-sdk-heavy crate versus ~350 MiB
          for a pure-logic one — a 7x spread that no single constant covers.
          Note this is NOT `cargo-build-jobs`: that caps rustc units INSIDE one
          build, and the two MULTIPLY.
        required: false
        type: number
        default: 0
      mutant-worker-mib:
        description: >-
          Measured peak resident memory of ONE mutant worker, in MiB. Only used
          when `jobs` is 0 (auto).

          Default 2500 comes from a real measurement, not a guess: a
          cargo-mutants run peaked at 2541 MB anon under a cgroup mirroring the
          3Gi runner pod exactly, at CARGO_BUILD_JOBS=1 — the same figure the
          infra role uses to size the runner tiers. Lower it for a crate with a
          light dependency closure to buy parallelism; a wrong value here is
          the one input that can still over-commit the pod.
        required: false
        type: string
        default: '2500'
      mutants-args:
        description: >-
          Extra flags passed verbatim to cargo mutants. WARNING: the default
          ('') is UNSCOPED — it mutates the ENTIRE cargo workspace, not just
          one crate. On a multi-crate workspace this has filled CI disk
          before. Callers with more than one crate MUST pass '-p
          <crate-name>' (or run a matrix, one job per crate). This job prints
          a ::warning:: when it detects an unscoped run against a
          multi-member workspace, but does not fail the build for it.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: >-
          Per-shard job timeout in minutes. Default 85 — deliberately BELOW
          job-arbiter's 90-minute stale-job reaper
          (platform/ffreis-home-infra ansible role job_arbiter:
          `max_in_progress_duration_secs: 90 * 60`). A job that runs past
          its own timeout-minutes fails with a clear, attributable "the job
          has exceeded the maximum execution time of 85 minutes" message; a
          job that instead runs into job-arbiter's external reaper gets
          silently cancelled with no such message and reads as flaky infra
          rather than a real timeout. Keeping this strictly under 90
          guarantees GitHub's own timeout always wins that race. This is a
          ceiling, not a target — see `shard-count` for actually keeping
          typical runs well under the 60-minute goal.
        required: false
        type: number
        default: 85
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted heavy tier
          [self-hosted, local, heavy]. Pass '["ubuntu-latest"]' for
          GitHub-hosted.

          scan-fix(ci:oom): was [self-hosted, local] (the light tier, a 2Gi
          pod). cargo-mutants rebuilds the crate once per mutant and is the
          single most memory-hungry job in the fleet; on the 2Gi pod it
          exhausts memory, and because the GitHub runner agent shares the pod
          cgroup with the build, the agent itself gets OOM-killed before the
          job ever reaches "Compute score and enforce threshold". That
          surfaces as "the self-hosted runner lost communication with the
          server" with BlobNotFound job logs — not a mutation-score failure —
          and has repeatedly been misread as flaky network/infra rather than
          a resource-tier mismatch. Measured live: a light-tier run sat at
          1714Mi against its 2Gi limit.

          A first correction defaulted this to xl (8Gi), reasoning "xl fits
          cargo-mutants' actual footprint and scales to zero the same way
          light does" — WRONG: xl sits at 0 replicas because it is
          UNSCHEDULABLE, not idle. Its 8Gi pod cannot be admitted on either
          fleet node while light/heavy are already running (burst-node:
          9.71Gi allocatable, ~4.7Gi free; local-server: 7.58Gi allocatable,
          ~3.6Gi free — job-arbiter only schedules a class when a single node
          can hold it), so a job on xl queues forever instead of failing —
          worse than the OOM it replaced, since a queued job never surfaces
          as a failure. heavy (3Gi) is 50% headroom over the 2Gi that OOM'd
          and IS schedulable alongside light/heavy on either node — evidence
          it's enough: ffreis-job-arbiter's mutation job PASSED on the 2Gi
          light tier, only ffreis-cluster-warden's failed there, so the real
          requirement sits between 2Gi and something modest, not 8Gi.
          Callers that already pass an explicit `runner:` (e.g. `light`) are
          unaffected by this default change.
        required: false
        type: string
        default: '["self-hosted","local","heavy"]'
      cargo-profile-debug:
        description: >-
          Sets CARGO_PROFILE_DEV_DEBUG — the dev profile's `debug` level, which
          the test profile inherits, so one value covers build and test.

          Default "line-tables-only" keeps panic backtraces (file/line still
          resolve) while dropping full DWARF, which is the single largest
          consumer of rustc and linker memory. Measured on ffreis-job-arbiter
          under a cgroup mirroring the runner pod, `cargo test --no-run`,
          jobs=2: 1931 MiB full debuginfo -> 1554 MiB line-tables-only, a 20%
          cut, with NO throughput cost.

          For contrast, capping parallelism — the knob this fleet has been
          tuning — bought 3% on the same build (jobs=1: 1872 MiB) while halving
          build concurrency, because peak is set by the single largest
          compilation unit, not by how many run at once. That is also why
          `cargo-build-jobs: 1` did not rescue ffreis-rust-shared at 2541 MB
          (99% of the 2.5Gi heavy tier) as this file's other comment records.

          Coverage is unaffected: cargo-llvm-cov uses instrumentation profiles,
          not DWARF. Verified byte-identical on ffreis-job-arbiter — 88.44%
          line / 87.35% region with and without.

          Pass "full" to restore complete debug info (a debugger or core-dump
          workflow), or "0" for the smallest possible footprint if you do not
          need backtraces.
        required: false
        type: string
        default: "line-tables-only"
      cargo-build-jobs:
        description: >-
          Caps CARGO_BUILD_JOBS (parallel rustc compile units).
          Default "auto" — derived from the runner pod's real cgroup memory
          limit at job start, so a tier resize cannot silently over-commit
          callers. Pass an explicit number to override (it always wins).

          Was "4", documented as memory-safe on a 4.5Gi self-hosted pod. That
          figure went stale — the heavy tier was resized 4.5Gi -> 2Gi -> 2.25Gi
          -> 2.5Gi -> 3Gi and this comment was never updated, so callers
          inheriting it were silently over-committed. Deriving it is what stops
          that recurring. The symptom is not a build failure: the runner agent
          shares the pod cgroup, so IT dies, surfacing as "the self-hosted
          runner lost communication with the server" with no logs.

          Measured on ffreis-rust-shared under a cgroup mirroring the heavy pod
          (MemoryMax=2560M, no swap, 2 CPU): peak anon 2541 MB at jobs=1 —
          99% of the limit before any parallelism. Memory is therefore
          dominated by a per-crate baseline, not linear in job count; a crate
          whose baseline alone exceeds the pod needs a bigger tier, not a
          smaller cap. Hosted-runner callers with real memory can pass a
          higher value (e.g. the runner's core count).
        type: string
        default: "auto"
      in-diff:
        description: >-
          On pull_request events, mutate ONLY the lines this PR changed
          (cargo-mutants --in-diff) instead of the whole crate. Strongly
          recommended for any crate big enough that a full run cannot finish
          inside timeout-minutes: ffreis-job-arbiter has 987 mutants against a
          ~28s test suite, which at 4 workers is ~123 min versus the 90 min
          default timeout — so its gate never once completed. Scoped to a PR's
          own diff the same repo finished in 109s. Also the better signal: it
          asks "are these new lines tested", not "is the whole crate perfect".
          Ignored on non-pull_request events, which have no base to diff.
        required: false
        type: boolean
        default: false
      shard-count:
        description: >-
          Number of matrix shards to split mutation testing across
          (cargo-mutants --shard k/n). Default 4.

          Evidence for the default: the `in-diff` input above records
          ffreis-job-arbiter's crate at 987 mutants, estimated ~123 min for
          a full unscoped run at this workflow's own default `jobs` worker
          count (4) — past both the 60-min goal and (with any variance) the
          90-min job-arbiter reaper. 123 min / 4 shards ≈ 31 min of actual
          mutation-testing compute per shard; this job already installs a
          prebuilt cargo-mutants binary (taiki-e/install-action, not a
          from-source `cargo install`) and uses Swatinem/rust-cache, so the
          fixed per-shard overhead on top of that is on the order of a few
          minutes — landing comfortably under 60 min per shard with real
          margin for a bigger or slower crate than the one measured.

          Deliberately NOT higher, and KEPT AT 4 (not lowered to 3) now that
          `ci-build`'s max_replicas actually IS 3 — see the job-topology
          note at the top of this file for the correction and its evidence.
          cargo-mutants' own docs suggest 8-32 shards as a starting point,
          but that assumes real parallel runner capacity well beyond what
          this fleet has. At max_replicas: 3, 4 shards run as 3 concurrent
          plus one queued behind them, not 4 fully serial — so the "extra
          shard adds another full round of fixed overhead for zero
          parallelism benefit" reasoning this paragraph used to state no
          longer holds AT ALL for the first 3; it still holds for the 4th,
          which is exactly why 4 (one deliberate unit of headroom over the
          replica cap) rather than exactly 3 (which would leave no slack for
          a crate bigger than the one measured, or for a second mutation run
          landing on the same tier at once) or something higher (which would
          queue two or more shards, paying their full fixed overhead
          serially with no offsetting benefit). Raising `ci-build`'s
          max_replicas further would change this trade again — a
          live-cluster capacity decision, out of scope for this file.

          Override UP for a crate known to be bigger than 987 mutants.
          Override DOWN to 1 for small/typical crates (most of the fleet) —
          a small crate sharded 4 ways pays 4x the fixed overhead for work
          that would finish in a couple of minutes unsharded. On a
          pull_request event with `in-diff` active, this workflow already
          collapses to 1 shard automatically regardless of this input (a
          diff-scoped PR run is typically a handful of mutants — see
          `shard-plan` below) — no override needed for that case.
        required: false
        type: number
        default: 4
      mutants-fail-fast:
        description: >-
          strategy.fail-fast for the shard matrix (see `shard-count`).
          Default false, matching cargo-mutants' own upstream CI example
          ("collect all mutants even if some are missed" —
          https://github.com/sourcefrog/cargo-mutants/blob/main/examples/workflows/sharded.yml):
          a shard's own job status only reflects a genuine harness/build
          failure, never a missed mutant (missed-mutant exit codes are
          swallowed — see the "Guard against a silent harness failure"
          step), so leaving this false costs nothing on the common path and
          guarantees mutation-aggregate always sees every shard's data
          before it decides pass/fail.

          Consider true for a caller whose runner pool is capacity-
          constrained enough that shards effectively queue and run
          SERIALLY rather than in parallel. CORRECTED: this fleet's own
          "heavy" tier is no longer that case — see the job-topology note at
          the top of this file — `ci-build`'s max_replicas is 3, not 1, so
          with the `shard-count` default of 4 the first 3 shards run
          concurrently and only the 4th queues behind them. A genuine infra
          fault in one of the 3 concurrent shards no longer wastes N-1 full
          serial rounds; it wastes only that shard's own partial run plus
          (if fail-fast cancels the still-queued 4th before it starts) that
          4th shard's wait. Still a real saving, just a smaller one than a
          fully-serial pool would see — which is why this default stays
          false rather than flipping to true here: the common-path cost of
          false (mutation-aggregate waiting for shards that were going to
          finish at roughly the same time anyway) is now small on this
          fleet, and false keeps the "always see every shard's data" benefit
          above unconditionally. Still worth true for a caller on a pool
          that genuinely serializes (max_replicas: 1, or a fleet with no
          spare heavy capacity at all).
        required: false
        type: boolean
        default: false
      mutants-timeout:
        description: >-
          Seconds passed to cargo-mutants' `--timeout` whenever this run
          also passes `--baseline skip` (shard-count > 1 — see `Run mutation
          testing` below). This makes today's IMPLICIT behavior explicit; it
          is not a change to it. Per https://mutants.rs/timeouts.html, the
          multiplier-based auto-timeout "cannot be used when the baseline is
          skipped. If no explicit timeout is provided in these cases, then
          there is no build timeout and the test timeout default of 300
          seconds will be used" — cargo-mutants itself warns about exactly
          this combination, reproduced verbatim against this fleet's
          cargo-mutants (27.1.0) by running `--baseline skip` with no
          `--timeout`:
            WARN An explicit test timeout is recommended when using
            --baseline=skip; using 300 seconds by default
          Upstream's own examples/workflows/sharded.yml passes `--timeout
          300` for the same reason. Default 300 here matches that implicit
          fallback exactly, so no existing caller's behavior changes.

          Lower it for a fast suite: measured on a private consumer crate's
          diagnosed shard (a 285-crate workspace pulling four AWS SDK
          crates, aws-lc-sys, ring and tree-sitter), a mutant cost roughly
          4-5s to build and ~0s to test, so 300s is generous headroom there,
          not a tight bound — a caller whose own suite is that fast can cut
          this substantially and fail faster on a genuinely hung mutant.

          Ignored (not passed) when shard-count is 1 — an unsharded run
          keeps cargo-mutants' own default `--baseline run` and its own
          multiplier-based timeout, neither of which this input touches.
          Also ignored, with a `::notice`, when the caller already passes
          `--timeout` or `-t` via `mutants-args`: a duplicated flag is a
          caller-visible cargo-mutants argument error, and at least one
          consumer already passes `--timeout` through `mutants-args` today.
        required: false
        type: number
        default: 300
      mutants-sharding:
        description: >-
          Sharding method passed to cargo-mutants' `--sharding` whenever
          this run also passes `--shard` with more than one shard
          (shard-count > 1). Default "round-robin".

          THIS IS A BEHAVIOR CHANGE for existing callers that do not
          override it, stated plainly rather than buried: cargo-mutants
          defaulted its OWN internal sharding to "slice" in 26.0.0 (assign
          the first n/k mutants to shard 0, the next n/k to shard 1, ...).
          Upstream's src/shard.rs doc says slice "may also lead to more
          unbalanced shards" while round-robin (assign mutant i to shard i %
          k) "distributes mutants more evenly and will likely generate more
          equal completion times." Verified against a private consumer crate
          (the same 285-crate workspace `mutants-timeout` above cites): under
          slice, one shard held 69 of its 77 mutants in a single source file
          while a different shard drew zero mutants from an entire module;
          under round-robin all four shards drew near-identical module
          mixes. Round-robin also bounds the damage of a dead shard (see the
          job-topology note at the top of this file for why a shard can die
          mid-run under memory pressure): losing one shard under slice can
          erase an entire module's worth of mutants from the aggregate
          score, where round-robin spreads that same shard's mutants across
          every module instead, so the aggregate loses a slice of coverage
          from everywhere rather than all of it from one place.

          AVAILABILITY, CHECKED, NOT ASSUMED: `--sharding` was added in
          cargo-mutants 26.0.0 and is declared `requires = "shard"` (verified
          against the 27.1.0 binary installed by this workflow today — help
          text confirms `--sharding <SHARDING>` and confirms `--shard` is a
          required companion). This workflow installs cargo-mutants via
          taiki-e/install-action with no version pin, so an older resolve
          remains possible for a future run; the `Run mutation testing` step
          below probes the installed binary's own `--help` output for
          `--sharding` before passing it, and just leaves that install's own
          default in place (with a `::notice`) rather than hard-failing the
          job when the flag is absent.

          Ignored (not passed) when shard-count is 1 — no `--shard` is
          passed in that case, so `--sharding` would have nothing to modify.
          Also ignored, with a `::notice`, when the caller already passes
          `--sharding` via `mutants-args` — mixing sharding methods across
          shards of one run would be meaningless anyway, since every shard
          of a given run gets the SAME value: it comes from this one input,
          not from anything that varies per shard.
        required: false
        type: string
        default: round-robin
      test-memory-limit-mb:
        description: >-
          Bounds the MUTATED TEST BINARY's address space, in MiB, via
          `CARGO_TARGET_<HOST_TRIPLE>_RUNNER="prlimit --as=<bytes> --"` — set
          for the `Run mutation testing` step ONLY (not `Baseline test run`,
          not the `mutation-warm` job). Default 0 = OFF: no existing
          caller's behavior changes.

          THE FAILURE MODE THIS ADDRESSES: a mutant that makes a test
          allocate without bound takes the WHOLE POD down, not just that one
          mutant's run, because the GitHub runner agent shares the pod
          cgroup with the build and `memory.oom.group` kills the entire
          cgroup together — confirmed in this fleet's own gha_runner
          entrypoint comment, which records exactly that: a Gradle job blew
          the pod memory limit, the kernel OOM-killed the whole pod cgroup
          INCLUDING the runner agent, and the pod could not self-heal
          without manual intervention. That is the same "the self-hosted
          runner lost communication with the server" signature this
          workflow already documents for a whole-build OOM — but here it can
          be triggered by ONE bad mutant killing the runner mid-shard, not
          just a cold build.

          TWO APPROACHES THAT DO NOT WORK HERE, recorded so they are not
          rediscovered:
            - A nested cgroup v2 (a child cgroup with a lower memory.max for
              just the test process): /sys/fs/cgroup is mounted read-only in
              an unprivileged container, and kubernetes/kubernetes#121190
              ("Writable cgroup for unprivileged containers") is still open
              as of 2026-09-30 — this needs `privileged` or `CAP_SYS_ADMIN`,
              neither of which this fleet grants runner pods.
            - `choom` / raising oom_score_adj on the test process: raising
              it is unprivileged and would normally make the kernel prefer
              killing the runaway build over the runner agent, but this
              fleet's own gha_runner manifests template records
              memory.oom.group killing the WHOLE pod cgroup together — so
              even a correctly-deprioritized build takes the agent down with
              it, and nothing survives to report which mutant did it.

          WHAT DOES WORK: Cargo's target runner wraps only the TEST BINARY —
          not cargo, not rustc, not the linker — so a runaway allocation
          hits RLIMIT_AS, the test process aborts with a non-zero exit, and
          cargo reports it as a normal test FAILURE, which cargo-mutants
          then records as CAUGHT instead of the pod dying and the whole
          shard's result being lost. Verified directly against a throwaway
          crate: with a 256 MiB RLIMIT_AS, an allocating test aborted
          (SIGABRT, "memory allocation of ... bytes failed") while a sibling
          test in the SAME binary still ran and passed first; `cargo test`
          exited non-zero and reported "test failed" — no pod, no agent,
          nothing lost except that one binary's own results.

          TWO CAVEATS THAT WILL OTHERWISE BE REDISCOVERED:
            - RLIMIT_AS bounds ADDRESS SPACE, not resident memory, so this
              must be set well above real need. Upstream cargo-mutants PR
              #651 measured a 256 MiB RLIMIT_AS failing a build in 54ms
              while the same build peaked at 140 MB RESIDENT under a 256 MiB
              cgroup — address-space reservations (mmap, allocator
              overcommit) run far ahead of what actually gets touched.
              Picking too tight a limit fails GOOD mutants, not just
              runaway ones.
            - The abort takes down the whole test PROCESS, so the harness
              prints no summary and every OTHER test in that same binary is
              lost too — confirmed above (the sibling test ran, but cargo
              printed no "test result: ..." line at all once the process
              aborted). Acceptable for mutation testing, where a caught
              mutant is caught either way; NOT acceptable for a normal test
              run, which is why this is scoped to the `Run mutation testing`
              step only and nowhere else in this file.

          THIS WORKFLOW PROBES for `prlimit` (util-linux) before relying on
          it and emits a `::warning` and skips the guard, rather than
          failing the job, if it is absent. The host triple is derived at
          runtime from `rustc -vV`'s `host:` line, uppercased with `-`
          replaced by `_` — never hardcoded, since this workflow has its own
          `os-list`/arch story and a hardcoded
          `x86_64_unknown_linux_gnu` would silently no-op on any other
          target.

          UPSTREAM IS BUILDING A FIRST-CLASS VERSION OF THIS: `--max-memory`
          with a cgroup-v2 backend, sourcefrog/cargo-mutants issue #594 and
          PRs #647-#653, all open and unmerged as of 2026-09-30. This input
          is a stopgap for this fleet's unprivileged runner pods, to be
          retired once that lands.
        required: false
        type: number
        default: 0
      in-place:
        description: >-
          Passes cargo-mutants' `--in-place` and OMITS `--jobs`. Default
          false: no existing caller's behavior changes.

          OMITTING `--jobs` IS MANDATORY, NOT STYLISTIC: verified against
          cargo-mutants 27.1.0 that `--in-place` is declared `conflicts_with
          = "jobs"`, and that `cargo mutants --in-place --jobs 1` fails
          outright:
            error: the argument '--in-place' cannot be used with '--jobs
            <JOBS>'
          This workflow currently always passes `--jobs` (the `jobs` input,
          default 4), so `--in-place` would be UNUSABLE by any caller today
          without this input also dropping `--jobs` when it's set.

          `--in-place` removes cargo-mutants' tree COPY entirely and builds
          directly in the restored checkout — the largest remaining
          reduction in both disk and build cost available on top of
          `mutation-warm`'s cache priming above (it doesn't just warm the
          copy target/ gets copied into, it removes the copy). Upstream's
          own CI guidance recommends it: https://mutants.rs/ci.html — "Use
          the `--in-place` option to avoid copying the tree."

          Also disables cargo-mutants' multiplier-based timeouts, for the
          same reason as `--baseline skip` above — verified against
          https://mutants.rs/timeouts.html: "The multiplier timeout options
          cannot be used when the baseline is skipped (--baseline=skip), or
          when the build is in-place (--in-place). If no explicit timeouts
          is provided in these cases, then there is no build timeout and the
          test timeout default of 300 seconds will be used." So
          `mutants-timeout` is applied whenever `in-place` is true, not only
          when actually sharded — see `Run mutation testing` below.

          Left false by default and does not change any existing consumer;
          opt in per caller once that caller's test suite is known safe to
          run against a live checkout (e.g. no test that assumes a pristine
          tree or writes into its own source directory).
        required: false
        type: boolean
        default: false
    outputs:
      mutation-score:
        description: 'Achieved mutation score (integer, 0–100), summed across all shards.'
        value: ${{ jobs.mutation-aggregate.outputs.score }}
    secrets:
      PRIVATE_DEPS_TOKEN:
        description: "Token with read access to private git-dependency repos (e.g. FLEET_READ_TOKEN). Optional — omit if the workspace has no private cargo git deps."
        required: false

jobs:
  shard-plan:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Plan mutation shards
    # Cheap jq/seq arithmetic — always GitHub-hosted regardless of `runner`,
    # so this never consumes self-hosted fleet capacity.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - name: Compute effective shard count and matrix
        id: plan
        env:
          REQUESTED_SHARDS: ${{ inputs.shard-count }}
          # A pull_request run that in-diff is actually going to scope is
          # typically a handful of mutants (see the `in-diff` input) —
          # sharding that pays N x the fixed per-shard overhead for a job
          # that finishes in well under a minute unsharded. Collapse to 1
          # shard whenever in-diff will actually apply; every other trigger
          # (schedule, workflow_dispatch, push) and any pull_request run
          # with in-diff off keeps the caller's requested shard-count.
          IN_DIFF_ACTIVE: ${{ inputs.in-diff && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail

          if [[ "${IN_DIFF_ACTIVE}" == "true" ]]; then
            total=1
            why="in-diff is scoping this pull_request run to its own diff"
          else
            total="${REQUESTED_SHARDS}"
            why="shard-count input"
          fi

          if ! [[ "$total" =~ ^[0-9]+$ ]] || [[ "$total" -lt 1 ]]; then
            echo "::error title=Invalid shard-count::shard-count must resolve to a positive integer, got '${total}'."
            exit 1
          fi

          shards=$(seq 0 $((total - 1)) | jq -R 'tonumber' | jq -cs .)
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "Mutation shards: ${total} (${why})"

  # mutation-warm: builds ONE shared target/ before any shard starts, so no
  # shard's cargo-mutants scratch tree can ever be built from a cold start.
  #
  # WHY, MEASURED — not argued. Same shard, same cgroup mirroring the heavy
  # pod exactly (MemoryMax=3G, swap off, CPUQuota=175%, CARGO_BUILD_JOBS=1,
  # CARGO_PROFILE_DEV_DEBUG=0), run twice:
  #
  #   cargo-mutants scratch tree   peak RSS     hit the 3Gi ceiling   outcome
  #   cold (no usable target/)     3221225472   2474 times            never finishes
  #   warm (target/ restored)      2014101504   0                     finished in 11m, full score
  #
  # (3221225472 bytes is EXACTLY the 3Gi MemoryMax; 2014101504 bytes is
  # 2.01Gi.) The heavy pod is big enough — what kills a shard is
  # COLD-BUILDING inside it. cargo-mutants' own `copy_target` (default true)
  # already copies a restored target/ into its scratch tree when one exists;
  # the gap was never that cargo-mutants can't use a warm target, it's that
  # one usually was not there for it to use.
  #
  # "USUALLY NOT THERE" WAS A COIN FLIP THIS WORKFLOW BUILT IN. The `Rust
  # cache` step below used to pass only `workspaces:`, so Swatinem/rust-cache
  # fell back to its automatic job-based key — keyed on `github.job` (the
  # static job id "mutation", identical across every matrix leg, NOT the
  # shard index) — so every shard in a run computed the SAME cache key and
  # raced to SAVE it. Observed on run 36678132846 shard 0:
  #   Failed to save: Unable to reserve cache with key
  #   v0-rust-mutation-Linux-x64-64f0fdd7-8451cd2f, another job may be
  #   creating this cache
  # Only whichever shard won that race left a usable target/ behind for the
  # NEXT run to restore; any of the others could be the one that draws the
  # mutant that runs the pod out of memory.
  #
  # THE FIX: one job builds and saves the shared cache entry ONCE, before the
  # matrix starts, and every shard only reads it. `mutation` below now
  # `needs: [shard-plan, mutation-warm]`, and both jobs' `Rust cache` steps
  # carry the SAME explicit `shared-key` so they target that one entry
  # deliberately instead of colliding on it by accident. Only THIS job saves
  # (`save-if: true`, the default — spelled out on this step so the contrast
  # with the matrix's `save-if: false` below is visible in a diff, not just
  # implied by omission); every shard is restore-only, which also removes
  # the "another job may be creating this cache" race entirely — there is
  # exactly one writer.
  #
  # THE TRADE, stated plainly: this spends one whole extra runner job
  # (checkout + toolchain install + a `cargo test --no-run` build) on every
  # mutation run, whether or not any shard would have won the old save race
  # that run. On this fleet's capacity — `ci-build` allows up to 3 concurrent
  # heavy replicas, see the job-topology note at the top of this file — that
  # job-size cost is the intended trade for turning a shard's
  # cold-build-into-OOM path from "sometimes happens" into "cannot happen".
  #
  # `needs: [shard-plan, mutation-warm]` on `mutation` below is also the
  # failure guard, CONFIRMED rather than assumed: a job's `if:` is implicitly
  # ANDed with success() of everything in its `needs:` UNLESS the expression
  # itself calls always()/failure()/cancelled() — `mutation`'s `if:` (copied
  # below) does none of those, so a failed mutation-warm skips the entire
  # matrix rather than letting it run every shard cold against a cache that
  # was never populated.
  mutation-warm:
    needs: shard-plan
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Warm the shared mutation build cache
    # Same expression as `mutation` below, INCLUDING the public-repo
    # override — this job builds the same crate on the same runner class the
    # matrix will use, so priming a cache the matrix can't restore from
    # (wrong OS/arch, wrong label set) would defeat the point.
    runs-on: ${{ github.event.repository.visibility == 'public' && fromJson('["ubuntu-latest"]') || fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      # Identical to `mutation`'s own RUSTUP_HOME below — see that job's env
      # block comment for the full EXDEV/overlayfs derivation. Needed here
      # too: this job installs the same toolchain the same way.
      RUSTUP_HOME: /home/runner/_work/_temp/rustup-ci
      CARGO_PROFILE_DEV_DEBUG: ${{ inputs.cargo-profile-debug }}
    steps:
      # Identical to `mutation`'s own "Resolve build parallelism" step below
      # — see that job's comment for the full derivation. Needed here too:
      # this job's own `cargo test --no-run` is a real build and must not
      # over-commit the pod any more than the matrix's builds do.
      - name: Resolve build parallelism
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED: ${{ inputs.cargo-build-jobs }}
        run: |
          set -euo pipefail
          if [ "${REQUESTED}" != "auto" ]; then
            echo "CARGO_BUILD_JOBS=${REQUESTED}" >> "$GITHUB_ENV"
            echo "build parallelism: ${REQUESTED} (explicit caller override)"
            exit 0
          fi
          # The path is a seam so this can be tested against fixtures — the
          # workspace's "inject IO, never real IO in a tested path" rule.
          # Production never sets it.
          limit="$(cat "${CGROUP_MEMORY_MAX_PATH:-/sys/fs/cgroup/memory.max}" 2>/dev/null || echo max)"
          cpus="$(nproc 2>/dev/null || echo 2)"
          # "max" means unlimited (hosted runners, or cgroup v1 layouts where
          # this file is absent). Never guess a big number from an unreadable
          # limit — fall back to the value this input used to hardcode.
          if [ "${limit}" = "max" ] || ! printf '%s' "${limit}" | grep -qE '^[0-9]+$'; then
            jobs=2
            why="cgroup limit unreadable or unlimited; safe fallback"
          else
            gib=$(( limit / 1073741824 ))
            [ "${gib}" -lt 1 ] && gib=1
            jobs="${gib}"
            [ "${jobs}" -gt "${cpus}" ] && jobs="${cpus}"
            why="${gib}GiB pod memory limit, ${cpus} cpu"
          fi
          echo "CARGO_BUILD_JOBS=${jobs}" >> "$GITHUB_ENV"
          echo "build parallelism: ${jobs} (${why})"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ inputs.in-diff && '0' || '1' }}

      - name: Configure git for private cargo dependencies
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$PRIVATE_DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            # cargo's libgit2 backend does not reliably honor url.insteadOf
            # credential rewriting; force it to shell out to system git,
            # which does.
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi

      - name: Install Rust (${{ inputs.toolchain }})
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ inputs.toolchain }}

      # See the job comment above for the full evidence. shared-key makes
      # this entry deliberate rather than the accidental collision the
      # matrix's identical shared-key used to guard against; save-if: true
      # (the default, spelled out for the contrast) makes this job the
      # cache's ONE writer.
      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: "${{ inputs.working-directory }} -> target"
          shared-key: mutation
          save-if: true

      # Populates target/ with compiled dependencies AND test binaries —
      # everything cargo-mutants' `copy_target` needs to skip a cold build —
      # without actually RUNNING the suite, which each shard's own "Baseline
      # test run" step below still does (that run is what verifies the
      # unmutated baseline passes; this one exists purely to leave build
      # artifacts behind).
      #
      # FEATURE FLAGS MUST MATCH what cargo-mutants itself will build, or
      # this job silently stops doing anything useful. cargo hashes build
      # artifacts by feature set, so a target/ built with the WRONG features
      # satisfies nothing — cargo rebuilds the graph from scratch on restore,
      # and every shard cold-builds anyway despite a "successful" warm job.
      # cargo-mutants does NOT default to --all-features: verified against
      # cargo-mutants 27.1.0's own --help, `--all-features`,
      # `--no-default-features` and `--features` are all OPT-IN (no
      # `[default: ...]` on any of them), so its default build is plain
      # default-feature resolution — identical to a bare `cargo test` with
      # no flags. A first version of this job hardcoded `--all-features`
      # unconditionally, which happens to be harmless for a crate with no
      # `[features]` section (that's every crate this fix was measured
      # against) but is a silent no-op for any OTHER consumer that declares
      # features and does not also pass matching flags through
      # `mutants-args` — caught in review before merge, not by the
      # measurement above, which is exactly why it would not have shown up
      # there. Fixed by extracting the SAME feature flags cargo-mutants will
      # receive out of `mutants-args`, and passing exactly those — nothing
      # when `mutants-args` carries none of them, matching cargo-mutants'
      # own default exactly.
      - name: Prime target/ for the matrix (build only, do not run)
        env:
          MUTANTS_ARGS: ${{ inputs.mutants-args }}
        run: |
          set -euo pipefail

          read -r -a mutants_args_arr <<< "${MUTANTS_ARGS:-}"

          # Same exact-token pattern as the `mutation` job's "Run mutation
          # testing" step below — duplicated, not shared, because GitHub
          # Actions steps do not share shell state even within one job, let
          # alone across the two jobs (same reason "Resolve build
          # parallelism" above is a byte-identical copy, not a call to a
          # shared script).
          has_mutants_arg() {
            local flag a
            for flag in "$@"; do
              for a in "${mutants_args_arr[@]}"; do
                [[ "$a" == "$flag" ]] && return 0
              done
            done
            return 1
          }

          # Companion to has_mutants_arg() for a flag that carries a VALUE
          # rather than being a bare toggle — `--features` accepts it in
          # either spelling cargo takes: split ("--features a,b", value is
          # the NEXT token) or joined ("--features=a,b", value is part of
          # the SAME token, after the "="). Scans every occurrence and keeps
          # the LAST one, matching clap's own override-on-repeat behavior
          # for a single-valued argument; returns failure (nothing printed)
          # when the flag is absent at all, same contract as
          # has_mutants_arg().
          mutants_arg_value() {
            local flag="$1" i a found=1 value=""
            for i in "${!mutants_args_arr[@]}"; do
              a="${mutants_args_arr[$i]}"
              if [[ "$a" == "$flag" ]]; then
                value="${mutants_args_arr[$((i + 1))]:-}"
                found=0
              elif [[ "$a" == "${flag}="* ]]; then
                value="${a#"${flag}="}"
                found=0
              fi
            done
            [[ "$found" -eq 0 ]] || return 1
            printf '%s' "$value"
          }

          feature_args=()
          if has_mutants_arg --all-features; then
            feature_args+=(--all-features)
          fi
          if has_mutants_arg --no-default-features; then
            feature_args+=(--no-default-features)
          fi
          if features_value="$(mutants_arg_value --features)"; then
            feature_args+=(--features "$features_value")
          fi

          cargo test "${feature_args[@]}" --no-run

  mutation:
    needs: [shard-plan, mutation-warm]
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Mutation score (cargo-mutants)
    strategy:
      fail-fast: ${{ inputs.mutants-fail-fast }}
      matrix:
        shard: ${{ fromJson(needs.shard-plan.outputs.shards) }}
    # PUBLIC repos are FORCED onto GitHub-hosted runners, overriding `runner`.
    # A public repo accepts pull requests from forks, and a self-hosted runner
    # executing fork-authored code would run arbitrary code on the homelab
    # cluster — GitHub documents this as unsafe, and it is the one case where
    # honouring the caller's input would be wrong. Private repos keep whatever
    # `runner` says (default: the self-hosted local cluster).
    #
    # `github.event.repository.visibility` is populated for every trigger type
    # this workflow supports — same mechanism ffreis-workflows-terraform's
    # tf-sonar.yml already uses to route private repos to the local SonarQube.
    runs-on: ${{ github.event.repository.visibility == 'public' && fromJson('["ubuntu-latest"]') || fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      # Keep rustup's home OFF the image's overlay lower layer.
      #
      # The runner image bakes a toolchain at /usr/local/rustup. When CI asks
      # for `stable` and upstream has moved, rustup tries to REPLACE the baked
      # components, which means renaming a directory that lives in a lower
      # overlayfs layer — and overlayfs answers EXDEV ("Invalid cross-device
      # link") for exactly that. rustup then rolls back and exits 1:
      #
      #   error: could not rename 'component' file from
      #   '/usr/local/rustup/toolchains/stable-.../share/doc/clippy'
      #   to '/usr/local/rustup/tmp/...': Invalid cross-device link (os error 18)
      #
      # It looks intermittent because a pod that survives one successful
      # update has copied-up and never fails again — only FRESH pods break. So
      # it surfaces after any Deployment roll, and `toolchain: 1.88.0` (the
      # MSRV, which matches what is baked) keeps passing while `stable` fails.
      #
      # Pointing RUSTUP_HOME at a writable path makes the install FRESH rather
      # than a replace, so no lower-layer rename happens. Cost: a minimal
      # toolchain download per pod (the action already passes
      # `--profile minimal`). That is the deliberate trade — a predictable
      # ~30-60s against a failure that is invisible until it isn't.
      #
      # The PATH MATTERS, and /tmp is the wrong one. In this fleet's runner
      # pods /tmp is an emptyDir with `sizeLimit: 2Gi`, and a toolchain is
      # ~2Gi — so a first attempt at this evicted the pod outright:
      #   Evicted: Usage of EmptyDir volume "tmp" exceeds the limit "2Gi"
      # which surfaces, again, as "the self-hosted runner lost communication".
      # /home/runner/_work is the `work` emptyDir at 8Gi, the only mount with
      # room. It is shared with the build's target/ dir, so a repo whose
      # target/ approaches 6Gi will need that limit raised rather than this
      # path changed.
      #
      # It also means CI no longer depends on the image's baked toolchain at
      # all, which is the answer to "should the image bake one?": it should
      # not, and this is what makes removing it safe.
      RUSTUP_HOME: /home/runner/_work/_temp/rustup-ci
      CARGO_PROFILE_DEV_DEBUG: ${{ inputs.cargo-profile-debug }}

    steps:
      # Resolve build parallelism BEFORE anything invokes cargo.
      #
      # This step is the single authority: a $GITHUB_ENV write beats both a
      # job-level `env:` and the value inherited from the runner pod's
      # container env (both measured on a real runner, 2026-08-21). So no
      # `CARGO_BUILD_JOBS` is declared at job level any more — if this step
      # were ever skipped, the pod's own value applies, which is a safe
      # fallback rather than an unset variable.
      #
      # `auto` derives the cap from the pod's REAL cgroup memory limit, so a
      # tier resize no longer silently over-commits every caller. That is the
      # failure this replaces: the previous constant ("4", documented as
      # memory-safe on a 4.5Gi pod) was never updated as the tier went
      # 4.5Gi -> 2Gi -> 2.25Gi -> 2.5Gi -> 3Gi, and the symptom is not a build
      # error — the runner agent shares the pod cgroup, so IT dies and the job
      # surfaces as "the self-hosted runner lost communication" with no logs.
      #
      # ~1 GiB per compile unit is deliberately conservative and is a CEILING,
      # not a target: measured peak on ffreis-rust-shared was 2541 MB at
      # jobs=1 (99% of a 2560M limit), i.e. memory is dominated by a
      # per-crate baseline rather than being linear in job count. No formula
      # can rescue a crate whose baseline alone exceeds the pod — those pass
      # an explicit number, which always wins over `auto`.
      - name: Resolve build parallelism
        # Pinned to the workspace root: this step runs BEFORE checkout, so the
        # job's default working-directory (the caller's `working-directory`
        # input, e.g. examples/hello) does not exist yet and bash cannot even
        # start. Caught by CI on the first run of this change.
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED: ${{ inputs.cargo-build-jobs }}
        run: |
          set -euo pipefail
          if [ "${REQUESTED}" != "auto" ]; then
            echo "CARGO_BUILD_JOBS=${REQUESTED}" >> "$GITHUB_ENV"
            echo "build parallelism: ${REQUESTED} (explicit caller override)"
            exit 0
          fi
          # The path is a seam so this can be tested against fixtures — the
          # workspace's "inject IO, never real IO in a tested path" rule.
          # Production never sets it.
          limit="$(cat "${CGROUP_MEMORY_MAX_PATH:-/sys/fs/cgroup/memory.max}" 2>/dev/null || echo max)"
          cpus="$(nproc 2>/dev/null || echo 2)"
          # "max" means unlimited (hosted runners, or cgroup v1 layouts where
          # this file is absent). Never guess a big number from an unreadable
          # limit — fall back to the value this input used to hardcode.
          if [ "${limit}" = "max" ] || ! printf '%s' "${limit}" | grep -qE '^[0-9]+$'; then
            jobs=2
            why="cgroup limit unreadable or unlimited; safe fallback"
          else
            gib=$(( limit / 1073741824 ))
            [ "${gib}" -lt 1 ] && gib=1
            jobs="${gib}"
            [ "${jobs}" -gt "${cpus}" ] && jobs="${cpus}"
            why="${gib}GiB pod memory limit, ${cpus} cpu"
          fi
          echo "CARGO_BUILD_JOBS=${jobs}" >> "$GITHUB_ENV"
          echo "build parallelism: ${jobs} (${why})"

      # fetch-depth 0 only when --in-diff needs a merge-base. Note the quoted
      # '0'/'1': GitHub expressions treat the NUMBER 0 as falsy, so the
      # unquoted form `inputs.in-diff && 0 || 1` silently evaluates to 1 and
      # the shallow clone breaks the merge-base lookup.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ inputs.in-diff && '0' || '1' }}

      - name: Configure git for private cargo dependencies
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$PRIVATE_DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            # cargo's libgit2 backend does not reliably honor url.insteadOf
            # credential rewriting; force it to shell out to system git,
            # which does.
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi

      - name: Install Rust (${{ inputs.toolchain }})
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ inputs.toolchain }}

      # shared-key + save-if: false: this shard RESTORES the entry
      # `mutation-warm` built and saved above; it never writes. See that
      # job's comment for why (the old default job-based key made every
      # shard compute the SAME key and race to save it — this removes that
      # race by making mutation-warm the cache's one writer).
      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: "${{ inputs.working-directory }} -> target"
          shared-key: mutation
          save-if: false

      # Disk-safety net (not a policy gate): mutants-args defaulting to ''
      # mutates the whole workspace, which has filled CI disk before on
      # multi-crate repos. This only warns — it never fails the job — because
      # some callers may be intentionally relying on today's unscoped
      # behavior mid-rollout. The actual policy fix (adding -p <crate> at
      # each caller) is a separate, per-repo change.
      - name: Warn on unscoped mutation testing (multi-crate workspace)
        # Identical on every shard (same workspace, same mutants-args) —
        # only emit it once so N shards don't repeat the same annotation.
        if: ${{ matrix.shard == 0 }}
        env:
          MUTANTS_ARGS: ${{ inputs.mutants-args }}
        run: |
          set -euo pipefail

          # Scoped callers (-p <crate>, --file, etc.) are exempt regardless
          # of workspace shape.
          if [[ -n "${MUTANTS_ARGS// /}" ]]; then
            exit 0
          fi

          if [[ ! -f Cargo.toml ]] || ! grep -q '^\[workspace\]' Cargo.toml; then
            exit 0  # single-crate repo — unscoped mutation covers only itself
          fi

          member_count=0
          if command -v cargo >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
            member_count=$(cargo metadata --no-deps --format-version=1 2>/dev/null \
              | jq '.workspace_members | length' 2>/dev/null || echo 0)
          fi
          if [[ -z "$member_count" || "$member_count" -eq 0 ]]; then
            # Fallback when cargo metadata/jq are unavailable: count quoted
            # path entries inside the `members = [...]` array text directly.
            members_block=$(awk '/members[[:space:]]*=/{flag=1} flag{print; if (/\]/) exit}' Cargo.toml)
            member_count=$(grep -oE '"[^"]+"' <<< "$members_block" | wc -l || echo 0)
          fi

          if [[ "$member_count" -gt 1 ]]; then
            echo "::warning title=Unscoped cargo-mutants run::mutants-args is empty ('') and this workspace declares ${member_count} member(s). The default mutates the ENTIRE workspace, which has filled CI disk before on multi-crate repos. Pass mutants-args: '-p <crate-name>' (or run one job per crate) to scope this run."
          fi

      # Prebuilt binary (no from-source compile per run) — matching what
      # rust-coverage/rust-test/rust-deny/rust-integration-coverage already do.
      #
      # This is load-bearing on the self-hosted fleet, not just a speedup:
      # `cargo install <tool> --locked` compiles a large crate graph inside the
      # runner pod, and the ci-light tier is capped at 2Gi. That OOM-kills the
      # pod mid-step — confirmed 2026-08-19 on ffreis-job-arbiter PR #61, where
      # `security / audit` died with "Install cargo-audit" never completing and
      # job_pod_terminated_total{reason="OOMKilled"} recording the kill for that
      # exact pod. Mutation would have hit the identical wall.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2.81.3
        with:
          tool: cargo-mutants

      # Establish a baseline — avoids counting slow clean-build time as test
      # time, and (per https://mutants.rs/shards.html) satisfies "if running
      # with --baseline=skip you must independently verify baseline tests
      # pass before sharding begins", which `Run mutation testing` below
      # relies on whenever this run is actually sharded.
      #
      # FEATURE FLAGS MATCH `mutants-args`, DELIBERATELY, not `--all-features`
      # (changed alongside `mutation-warm`'s own feature-flag fix above — see
      # that job's comment for the full derivation of why cargo-mutants does
      # NOT default to --all-features). Two independent reasons, not just
      # one:
      #   - CORRECTNESS: this step exists to prove the UNMUTATED baseline
      #     passes for the exact configuration cargo-mutants is about to
      #     mutate. A superset of features is not a strictly stronger
      #     version of that check — feature-gated code can behave
      #     differently under a different feature set (a path only reachable
      #     under one, a conditionally-disabled path under another) — it is
      #     a check of a DIFFERENT configuration, which can pass while the
      #     one actually mutated would not, or the reverse. Matching is the
      #     only way this step verifies what it claims to.
      #   - COST: this step now runs immediately after `mutation-warm`'s
      #     restore. If this step's feature set differs from what
      #     `mutation-warm` primed, cargo does not recognize the restored
      #     objects as satisfying it (cargo fingerprints build artifacts by
      #     feature set) and rebuilds a second, unused variant here — on
      #     EVERY shard, since this step runs once per shard job — before
      #     `Run mutation testing` below goes back to the ORIGINAL
      #     (matching) feature set and finds its own cache entry still warm.
      #     Matching removes that wasted N-shard rebuild entirely.
      - name: Baseline test run
        env:
          MUTANTS_ARGS: ${{ inputs.mutants-args }}
        run: |
          set -euo pipefail

          read -r -a mutants_args_arr <<< "${MUTANTS_ARGS:-}"

          # Same pattern as `mutation-warm`'s own feature-flag extraction
          # above (duplicated, not shared — see that job's comment for why)
          # and as `Run mutation testing` below's has_mutants_arg().
          has_mutants_arg() {
            local flag a
            for flag in "$@"; do
              for a in "${mutants_args_arr[@]}"; do
                [[ "$a" == "$flag" ]] && return 0
              done
            done
            return 1
          }

          mutants_arg_value() {
            local flag="$1" i a found=1 value=""
            for i in "${!mutants_args_arr[@]}"; do
              a="${mutants_args_arr[$i]}"
              if [[ "$a" == "$flag" ]]; then
                value="${mutants_args_arr[$((i + 1))]:-}"
                found=0
              elif [[ "$a" == "${flag}="* ]]; then
                value="${a#"${flag}="}"
                found=0
              fi
            done
            [[ "$found" -eq 0 ]] || return 1
            printf '%s' "$value"
          }

          feature_args=()
          if has_mutants_arg --all-features; then
            feature_args+=(--all-features)
          fi
          if has_mutants_arg --no-default-features; then
            feature_args+=(--no-default-features)
          fi
          if features_value="$(mutants_arg_value --features)"; then
            feature_args+=(--features "$features_value")
          fi

          cargo test "${feature_args[@]}" 2>&1 | tail -5

      # cargo-mutants requires the diff to apply cleanly to the CURRENT tree —
      # it aborts with "Diff content doesn't match source file" otherwise. So:
      # three-dot (merge-base) diff, computed on the PR head, against a
      # full-history checkout.
      - name: Compute PR diff for --in-diff
        id: diff
        if: ${{ inputs.in-diff && github.event_name == 'pull_request' }}
        # working-directory + `git diff --relative` is load-bearing, not tidying.
        # cargo-mutants runs INSIDE inputs.working-directory and reads the diff's
        # paths as relative to there. Computing the diff at the repo root emits
        # repo-root paths, so for any caller whose Cargo workspace is in a
        # subdirectory every hunk path carries a prefix cargo-mutants cannot
        # match: it reports "No mutants to filter", writes no outcome files, and
        # the scorer below correctly hard-fails on a run that measured nothing.
        # That silently disabled this gate on EVERY *-lambdas-rust repo in the
        # fleet (all of them pass `working-directory: lambdas`); it surfaced only
        # once the scorer stopped treating "no outcomes" as a clean 100%.
        # `--relative` also scopes the diff to that directory, which is correct:
        # a change outside the workspace has no mutants in it.
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DIFF_PATH: ${{ runner.temp }}/pr.diff
        run: |
          set -euo pipefail

          base=""
          for candidate in "origin/${BASE_REF}" "${BASE_REF}"; do
            if git rev-parse --verify --quiet "$candidate" >/dev/null 2>&1; then
              base="$candidate"
              break
            fi
          done
          if [[ -z "$base" ]]; then
            echo "::error title=Mutation diff error::cannot resolve base ref '${BASE_REF}'. Ensure the checkout used fetch-depth: 0."
            exit 1
          fi

          git diff --relative "${base}...HEAD" -- '*.rs' > "$DIFF_PATH"

          # Guard the invariant this step exists to satisfy: every path in the
          # diff must resolve RELATIVE TO the workspace directory, because that
          # is how cargo-mutants reads them. If the first one does not, the diff
          # was computed against the wrong base directory and `--in-diff` would
          # match nothing — producing zero mutants, zero outcome files and a
          # scorer hard-fail whose message points nowhere near the cause. Fail
          # here instead, naming the path, so the next person gets one line
          # instead of an afternoon. (`+++ /dev/null` for deletions is skipped
          # by the `b/` anchor.)
          first_path="$(grep -m1 '^+++ b/' "$DIFF_PATH" | sed 's|^+++ b/||' || true)"
          if [[ -n "$first_path" && ! -e "$first_path" ]]; then
            echo "::error title=Mutation diff error::diff paths are not relative to working-directory '${{ inputs.working-directory }}' (first entry: '${first_path}'). cargo-mutants would match nothing and report 'No mutants to filter'."
            exit 1
          fi

          if [[ ! -s "$DIFF_PATH" ]]; then
            echo "result=empty" >> "$GITHUB_OUTPUT"
            echo "::notice title=Mutation skipped::This PR changes no Rust source under '${{ inputs.working-directory }}', so there is nothing to mutate."
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
            echo "Mutating only lines changed by this PR ($(grep -c '^+++' "$DIFF_PATH") changed .rs file(s))."
          fi

      # ── Resource budget ──────────────────────────────────────────────
      # The worker count is the single input that has OOM-killed this job
      # across the fleet, because one worker is a FULL crate build and the
      # runner agent shares the pod cgroup with it — so when the pod is
      # over-committed the OOM killer can take the AGENT, and the job dies
      # mid-step with empty step conclusions and BlobNotFound logs. That reads
      # as flaky infrastructure rather than "you asked for more memory than
      # you have", which is why it kept being re-tuned by hand instead of
      # fixed.
      #
      # ci-budget reads the limit from the CGROUP rather than /proc/meminfo —
      # inside a pod the latter reports the NODE's free memory, which is how a
      # "memory-aware" cap plans three 2.5 GB workers into a 3 GiB pod. Skipped
      # entirely when a caller pins `jobs` explicitly; their number wins.
      - name: Plan mutant workers
        id: budget
        if: ${{ inputs.jobs == 0 }}
        uses: FelipeFuhr/ffreis-workflows-general/.github/actions/ci-budget@67ab77cd9e05184bb7e860e83481a4e339a63a0c # untagged; 2 commits past v2.1.0
        with:
          per-worker-mib: ${{ inputs.mutant-worker-mib }}

      # Captured BEFORE the run because light/heavy runners are persistent,
      # not ephemeral — a previous job's OOM leaves the cgroup counter
      # non-zero, and only the DELTA across this step pair is ours.
      - name: Record the OOM baseline
        id: oom-before
        uses: FelipeFuhr/ffreis-workflows-general/.github/actions/ci-budget@67ab77cd9e05184bb7e860e83481a4e339a63a0c # untagged; 2 commits past v2.1.0
        with:
          mode: report

      - name: Run mutation testing
        id: run
        if: ${{ steps.diff.outputs.result != 'empty' }}
        env:
          MUTATION_JOBS: ${{ inputs.jobs > 0 && inputs.jobs || steps.budget.outputs.workers }}
          MUTANTS_ARGS: ${{ inputs.mutants-args }}
          IN_DIFF: ${{ steps.diff.outputs.result == 'ok' && format('{0}/pr.diff', runner.temp) || '' }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ needs.shard-plan.outputs.total }}
          MUTANTS_TIMEOUT: ${{ inputs.mutants-timeout }}
          MUTANTS_SHARDING: ${{ inputs.mutants-sharding }}
          IN_PLACE: ${{ inputs.in-place }}
          TEST_MEMORY_LIMIT_MB: ${{ inputs.test-memory-limit-mb }}
        run: |
          set -euo pipefail

          read -r -a mutants_args_arr <<< "${MUTANTS_ARGS:-}"

          # Exact-token membership test over mutants_args_arr — a substring
          # test would false-positive on an unrelated value that merely
          # CONTAINS e.g. "-t". Used below to defer to a caller who already
          # passes --timeout/-t or --sharding through mutants-args, per the
          # `mutants-timeout` / `mutants-sharding` input descriptions.
          has_mutants_arg() {
            local flag a
            for flag in "$@"; do
              for a in "${mutants_args_arr[@]}"; do
                [[ "$a" == "$flag" ]] && return 0
              done
            done
            return 1
          }

          in_diff_args=()
          if [[ -n "${IN_DIFF:-}" ]]; then
            in_diff_args=(--in-diff "$IN_DIFF")
          fi

          # --in-place / --jobs are MUTUALLY EXCLUSIVE — verified against
          # cargo-mutants 27.1.0: `--in-place` is declared `conflicts_with =
          # "jobs"`, and passing both fails outright with "the argument
          # '--in-place' cannot be used with '--jobs <JOBS>'". So --jobs is
          # passed UNLESS in-place is on; see the `in-place` input for the
          # full derivation of why this trade is worth it.
          jobs_args=()
          in_place_args=()
          if [[ "${IN_PLACE}" == "true" ]]; then
            in_place_args=(--in-place)
          else
            jobs_args=(--jobs "$MUTATION_JOBS")
          fi

          # Always passed, even at SHARD_TOTAL=1 ("shard 0 of 1" is a no-op —
          # every mutant belongs to the single shard). One code path for
          # both the sharded and unsharded case.
          shard_args=(--shard "${SHARD_INDEX}/${SHARD_TOTAL}")

          # --baseline skip only when actually sharded (SHARD_TOTAL > 1).
          # The "Baseline test run" step above already verifies the
          # unmutated crate passes once per shard job; skipping
          # cargo-mutants' OWN internal baseline avoids paying that same
          # verification a second time on every shard. Per
          # https://mutants.rs/shards.html: "if running with
          # --baseline=skip you must independently verify baseline tests
          # pass before sharding begins" — the step above satisfies that.
          # Left in place (cargo-mutants' own baseline still runs) for the
          # unsharded default path, to avoid changing that path's
          # long-standing behavior.
          baseline_args=()
          if [[ "${SHARD_TOTAL}" -gt 1 ]]; then
            baseline_args=(--baseline skip)
          fi

          # --timeout whenever --baseline skip OR --in-place is also being
          # passed (see `baseline_args` and `in_place_args` above) —
          # cargo-mutants itself warns about --baseline=skip specifically
          # ("An explicit test timeout is recommended when using
          # --baseline=skip; using 300 seconds by default", reproduced
          # verbatim against cargo-mutants 27.1.0), and per
          # https://mutants.rs/timeouts.html both trigger the same
          # limitation: "The multiplier timeout options cannot be used when
          # the baseline is skipped (--baseline=skip), or when the build is
          # in-place (--in-place). If no explicit timeouts is provided in
          # these cases, then there is no build timeout and the test timeout
          # default of 300 seconds will be used." See the `mutants-timeout`
          # input for the full derivation, including why 300 is not a
          # behavior change. Deferred to the caller's own --timeout/-t, if
          # any, rather than doubling the flag.
          timeout_args=()
          if [[ "${SHARD_TOTAL}" -gt 1 || "${IN_PLACE}" == "true" ]]; then
            if has_mutants_arg --timeout -t; then
              echo "::notice title=Mutation timeout::mutants-args already passes --timeout/-t; not adding the mutants-timeout default (${MUTANTS_TIMEOUT}s)."
            else
              timeout_args=(--timeout "$MUTANTS_TIMEOUT")
            fi
          fi

          # --sharding whenever this run actually shards (SHARD_TOTAL > 1,
          # so --shard above is non-trivial). See the `mutants-sharding`
          # input for the full derivation (why round-robin, and why this is
          # a deliberate behavior change). Two guards, in order: defer to a
          # caller's own --sharding in mutants-args, same as --timeout
          # above; and probe the INSTALLED cargo-mutants for the flag before
          # relying on it, since this workflow installs an unpinned version
          # and --sharding only exists from 26.0.0 onward — an unsupported
          # flag must not hard-fail every consumer, so this falls back to
          # that install's own default instead.
          sharding_args=()
          if [[ "${SHARD_TOTAL}" -gt 1 ]]; then
            if has_mutants_arg --sharding; then
              echo "::notice title=Mutation sharding::mutants-args already passes --sharding; not adding the mutants-sharding default (${MUTANTS_SHARDING})."
            elif cargo mutants --help 2>/dev/null | grep -q -- '--sharding'; then
              sharding_args=(--sharding "$MUTANTS_SHARDING")
            else
              echo "::notice title=Mutation sharding::installed cargo-mutants has no --sharding flag (added in 26.0.0); leaving its own default sharding method in place."
            fi
          fi

          # Memory guard on the TEST BINARY ONLY (test-memory-limit-mb, off
          # by default so no existing caller changes behavior). See that
          # input's own description for why this is the only approach that
          # survives this fleet's unprivileged runner pods, and what
          # upstream is building to replace it. Deliberately set by
          # exporting into THIS step's own shell rather than via
          # `$GITHUB_ENV` — that would leak it into every later step
          # (`Guard against a silent harness failure`, `Upload mutants
          # output`, ...), where it has no business applying.
          if [[ "${TEST_MEMORY_LIMIT_MB}" -gt 0 ]]; then
            if command -v prlimit >/dev/null 2>&1; then
              host_triple="$(rustc -vV | sed -n 's/^host: //p')"
              if [[ -z "$host_triple" ]]; then
                echo "::warning title=Mutation memory guard::could not determine the host triple from 'rustc -vV'; skipping test-memory-limit-mb."
              else
                # Cargo's own naming convention: uppercase the triple,
                # replace '-' with '_'. Derived at runtime, never hardcoded —
                # this workflow has its own os-list/arch story.
                runner_var="CARGO_TARGET_$(tr '[:lower:]-' '[:upper:]_' <<< "$host_triple")_RUNNER"
                limit_bytes=$(( TEST_MEMORY_LIMIT_MB * 1024 * 1024 ))
                export "${runner_var}=prlimit --as=${limit_bytes} --"
                echo "Memory guard: ${runner_var}=\"prlimit --as=${limit_bytes} --\" (RLIMIT_AS, test binary only, mutation step only)"
              fi
            else
              echo "::warning title=Mutation memory guard::prlimit (util-linux) is not installed on this runner; skipping test-memory-limit-mb rather than failing the job."
            fi
          fi

          # DO NOT pass `--output mutants.out`. cargo-mutants treats --output as
          # the PARENT directory and creates <parent>/mutants.out inside it, so
          # that spelling wrote results to mutants.out/mutants.out/*.txt while
          # the scorer below read mutants.out/*.txt. Every count came back 0,
          # which the old "total == 0 -> pass" branch reported as a clean 100%.
          # The gate therefore could not fail on ANY consumer repo. The default
          # output location is already ./mutants.out — which is what the scorer
          # and the artifact upload both expect. Verified 2026-08-19 against
          # cargo-mutants 27.1.0.
          #
          # Exit code 0 = all caught, 2 = missed, 3 = timeout, 4 = error. It is
          # swallowed so the scorer owns the pass/fail decision (it must run on
          # partial results too); the scorer hard-fails when no outcome files
          # exist, so a crashed run can no longer slip through as a pass.
          # The exit code is CAPTURED, not discarded, because the scorer needs
          # to tell two very different "no mutants.out/" cases apart:
          #   exit 0 + no output dir -> cargo-mutants ran and had nothing to
          #                             mutate (e.g. an --in-diff whose only
          #                             .rs changes are test files, which it
          #                             does not mutate). It prints
          #                             "No mutants to filter" and writes NO
          #                             directory at all. This is a PASS.
          #   non-0 + no output dir  -> it died before writing anything. This
          #                             is a harness error and must FAIL.
          # Without this, the scorer's own missing-evidence guard misfires on
          # a perfectly good run — observed on job-arbiter #65, whose only .rs
          # change was tests/mutation_score.rs.
          set +e
          cargo mutants \
            "${jobs_args[@]}" \
            "${shard_args[@]}" \
            "${baseline_args[@]}" \
            "${timeout_args[@]}" \
            "${sharding_args[@]}" \
            "${in_place_args[@]}" \
            "${in_diff_args[@]}" \
            "${mutants_args_arr[@]}" \
            2>&1
          mutants_rc=$?
          set -e
          echo "rc=${mutants_rc}" >> "$GITHUB_OUTPUT"
          echo "cargo-mutants exited ${mutants_rc}"

      # Per-shard: verify cargo-mutants left real evidence behind, or a
      # legitimate "nothing to mutate" — never a silent harness failure.
      # Threshold enforcement moved to the mutation-aggregate job below,
      # which is the only place that has ALL shards' outcomes to score
      # against; a per-shard threshold check would be meaningless (a shard
      # could easily hold 0 or 1 mutants) and could wrongly fail a shard for
      # mutants that live entirely in a different shard.
      # `always()` so this still reports when the run above failed — an OOM is
      # exactly the case where the run does NOT succeed, and reporting only on
      # success would lose the one signal worth having. `fail-on-oom` turns the
      # kernel's oom_kill counter into an attributable step failure, so the
      # next reader sees "this job exceeded its memory budget" instead of
      # inferring it from a null step conclusion.
      #
      # It runs BEFORE the harness guard deliberately: when both would fire,
      # "the pod ran out of memory" is the more useful message than "the
      # harness produced no output", and the second is a consequence of the
      # first.
      - name: Report the memory budget outcome
        if: ${{ always() && steps.diff.outputs.result != 'empty' }}
        uses: FelipeFuhr/ffreis-workflows-general/.github/actions/ci-budget@67ab77cd9e05184bb7e860e83481a4e339a63a0c # untagged; 2 commits past v2.1.0
        with:
          mode: report
          baseline-oom-kills: ${{ steps.oom-before.outputs.oom-kills }}
          fail-on-oom: 'true'

      - name: Guard against a silent harness failure
        id: guard
        if: ${{ steps.diff.outputs.result != 'empty' }}
        env:
          MUTANTS_RC: ${{ steps.run.outputs.rc }}
        run: |
          set -euo pipefail

          # Absence of evidence is NOT evidence of success. If cargo-mutants
          # wrote no outcome files at all, the harness is broken (wrong path,
          # crashed run, bad args) — fail loudly instead of letting the
          # aggregate job silently read this shard as "nothing to mutate".
          # This distinction is the whole bug this guard exists to prevent:
          # the original scorer could not tell "ran, found nothing to
          # mutate" from "never produced results", and called both a pass.
          #
          # But the mirror-image mistake is just as wrong, and the first
          # version of this guard made it: cargo-mutants writes NO directory
          # at all when it has nothing to mutate — an --in-diff whose only .rs
          # changes are test files prints "No mutants to filter" and exits 0.
          # Treating that as a harness error fails a perfectly good run.
          # Observed on job-arbiter #65 (only .rs change: tests/mutation_score.rs).
          # So the exit code, not the directory alone, is what separates them.
          # Same logic applies per-shard: a shard whose slice of the diff/
          # workspace has nothing mutable legitimately produces no output.
          if [[ ! -d mutants.out ]]; then
            if [[ "${MUTANTS_RC:-1}" == "0" ]]; then
              echo "::notice title=Mutation Score::shard ${{ matrix.shard }} ran and found nothing to mutate (exit 0, no outcome files)."
              exit 0
            fi
            echo "::error title=Mutation harness error::mutants.out/ does not exist on shard ${{ matrix.shard }} and cargo-mutants exited ${MUTANTS_RC:-unknown} — it died before writing any outcomes. This is a harness bug, not a passing run."
            exit 1
          fi

          # One more shape the two checks above cannot see, because it leaves
          # the SAME evidence a healthy "nothing to mutate" run leaves: when the
          # UNMUTATED BASELINE fails, cargo-mutants writes mutants.out/ with all
          # four outcome files present and EMPTY, generates no mutants, and
          # exits 4. Exit 4 is cargo-mutants' generic harness-error code (its
          # own comment above says "4 = error"), and every cause of it shares
          # the property that matters here: nothing was measured, so there is
          # no score to report. Failing on it is correct whatever produced it. The directory exists, so the check above passes it; the
          # files exist, so have_outcomes below passes it; and the aggregate
          # step then sees total=0 and reports `score=100`.
          #
          # Measured, not hypothetical: ffreis-flowgraph-engine's gate reported
          # success while testing ZERO mutants from B3 until 2026-09-28, because
          # four of its tests read the repository's own directory and
          # cargo-mutants copies the tree WITHOUT .git. Note that the repo's own
          # "Baseline test run" step cannot catch this either — it runs in the
          # checkout, where .git is present and the tests pass.
          if [[ "${MUTANTS_RC:-}" == "4" ]]; then
            echo "::error title=Mutation harness error::cargo-mutants exited 4 on shard ${{ matrix.shard }} — a harness error, so NO mutants were generated and nothing was measured. mutants.out/ and its four outcome files exist but are empty, which is why this is not caught as missing evidence above. The measured cause of this is a failing UNMUTATED BASELINE: check mutants.out/outcomes.json for a Baseline outcome whose summary is Failure, and fix those tests in a copy of the tree WITHOUT .git — that is what cargo-mutants tests."
            exit 1
          fi

          have_outcomes=0
          for f in caught.txt missed.txt unviable.txt timeout.txt; do
            if [[ -f "mutants.out/${f}" ]]; then
              have_outcomes=1
              break
            fi
          done
          if [[ "$have_outcomes" -eq 0 ]]; then
            echo "::error title=Mutation harness error::no cargo-mutants outcome files (caught/missed/unviable/timeout.txt) under mutants.out/ on shard ${{ matrix.shard }}. Refusing to treat a run with no evidence as clean."
            ls -la mutants.out || true
            exit 1
          fi

          echo "Shard ${{ matrix.shard }} produced evidence — scoring deferred to the mutation-aggregate job."

      # Upload missed/timeout mutant lists to make actionable findings
      # visible, and so mutation-aggregate below can sum them. One artifact
      # name per shard — actions/upload-artifact v4 rejects duplicate names
      # within a run, and each matrix leg is a separate upload.
      - name: Upload mutants output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-report-shard-${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/mutants.out/
          retention-days: 7
          if-no-files-found: ignore

  mutation-aggregate:
    needs: [shard-plan, mutation]
    # always() so this still runs (and can report a clear failure) when a
    # shard failed — the default implicit `if: success()` would instead
    # skip straight past it and leave `outputs.mutation-score` empty, which
    # reads as "nothing measured" rather than "a shard broke". Gated on
    # shard-plan succeeding so a draft-PR skip (shard-plan itself skipped)
    # propagates to a skip here too, instead of a false failure.
    if: ${{ always() && needs.shard-plan.result == 'success' }}
    name: Mutation score (aggregate)
    # Only sums small text files across downloaded artifacts — always
    # GitHub-hosted, never consumes self-hosted fleet capacity.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      score: ${{ steps.score.outputs.score }}
    steps:
      - name: Fail fast if any shard did not succeed
        if: ${{ needs.mutation.result != 'success' }}
        run: |
          echo "::error title=Mutation harness error::at least one mutation shard did not succeed (result: ${{ needs.mutation.result }}). See the 'mutation' matrix jobs above for the specific shard and error. Not computing an aggregate score."
          exit 1

      - name: Download all shard reports
        if: ${{ needs.mutation.result == 'success' }}
        # Zero shard artifacts is a real, legitimate outcome (e.g. every
        # shard's --in-diff found nothing mutable) — never let a missing
        # artifact itself fail this job; the scoring step below decides
        # what an empty download means.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutants-report-shard-*
          path: downloaded

      - name: Compute aggregate score and enforce threshold
        id: score
        if: ${{ needs.mutation.result == 'success' }}
        env:
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          threshold="${THRESHOLD:-}"
          if [[ -z "$threshold" ]]; then
            echo "::error::threshold input is required"
            exit 1
          fi

          # Every shard already passed its own "Guard against a silent
          # harness failure" step (or this job would have failed fast
          # above) — so by this point, any shard with no output legitimately
          # had nothing to mutate. Summing zero real evidence across all
          # shards is therefore a genuine "nothing to score" outcome, not a
          # harness bug: same shape as the original single-job scorer's
          # own total==0 branch, just aggregated across N directories.
          count_lines() {
            local pattern="$1" total=0 f n
            for f in downloaded/mutants-report-shard-*/"${pattern}"; do
              n=$(grep -c . "$f" 2>/dev/null || true)
              total=$(( total + ${n:-0} ))
            done
            echo "$total"
          }

          caught=$(count_lines caught.txt)
          missed=$(count_lines missed.txt)
          timed_out=$(count_lines timeout.txt)
          unviable=$(count_lines unviable.txt)

          # Unviable mutants (the mutation does not compile) are excluded
          # from the score deliberately: no test could ever have caught them.
          total=$(( caught + missed ))
          echo "Caught: ${caught}  Missed: ${missed}  Timeout: ${timed_out}  Unviable: ${unviable} (summed across all shards)"

          if [[ "$total" -eq 0 ]]; then
            echo "::notice title=Mutation Score::no shard reported any caught/missed mutants — either every shard found nothing to mutate (e.g. an --in-diff run touching no mutable code) or unviable-only. Nothing to score; marking as passed."
            echo "score=100" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          score=$(( caught * 100 / total ))
          echo "score=${score}" >> "$GITHUB_OUTPUT"
          echo "Score: ${score}%  Threshold: ${threshold}%"

          if [[ "$score" -lt "$threshold" ]]; then
            echo "::error title=Mutation Score Too Low::Score ${score}% is below threshold ${threshold}%. Caught ${caught}/${total} mutants across all shards. Add tests that exercise more code paths."
            echo "Surviving mutants (first 20, across all shards):"
            cat downloaded/mutants-report-shard-*/missed.txt 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "::notice title=Mutation Score OK::Score ${score}% ≥ threshold ${threshold}% (${caught}/${total} mutants caught across all shards)."

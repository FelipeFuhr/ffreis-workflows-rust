name: Rust Mutation Testing

# Reusable workflow — callers invoke via:
#   uses: ./.github/workflows/rust-mutation.yml
#
# Intended schedule: weekly (Sunday 02:00 UTC) or workflow_dispatch.
# Do NOT run on every PR — mutation testing is slow (15–90 min per repo).
#
# Exit behaviour:
#   - exit 0  → mutation score ≥ threshold   (pass)
#   - exit 1  → mutation score  < threshold  (fail CI)

on:
  workflow_call:
    inputs:
      toolchain:
        description: 'Rust toolchain to use'
        required: false
        type: string
        default: 'stable'
      working-directory:
        description: 'Directory containing Cargo.toml (workspace or package root)'
        required: false
        type: string
        default: '.'
      threshold:
        description: 'Minimum mutation score (0–100). CI fails if caught% is below this.'
        required: false
        type: number
        default: 60
      jobs:
        description: 'Parallel mutant workers (each worker builds + tests one mutant)'
        required: false
        type: number
        default: 4
      mutants-args:
        description: >-
          Extra flags passed verbatim to cargo mutants. WARNING: the default
          ('') is UNSCOPED — it mutates the ENTIRE cargo workspace, not just
          one crate. On a multi-crate workspace this has filled CI disk
          before. Callers with more than one crate MUST pass '-p
          <crate-name>' (or run a matrix, one job per crate). This job prints
          a ::warning:: when it detects an unscoped run against a
          multi-member workspace, but does not fail the build for it.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: 'Total job timeout in minutes'
        required: false
        type: number
        default: 90
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'
      cargo-build-jobs:
        description: >-
          Caps CARGO_BUILD_JOBS (parallel rustc compile units). Default "4"
          matches the workspace Makefile convention — memory-safe on a
          4.5Gi-limited self-hosted runner pod. Hosted-runner callers wanting
          full parallelism can pass a higher value (e.g. the runner's core
          count).
        type: string
        default: "4"
      in-diff:
        description: >-
          On pull_request events, mutate ONLY the lines this PR changed
          (cargo-mutants --in-diff) instead of the whole crate. Strongly
          recommended for any crate big enough that a full run cannot finish
          inside timeout-minutes: ffreis-job-arbiter has 987 mutants against a
          ~28s test suite, which at 4 workers is ~123 min versus the 90 min
          default timeout — so its gate never once completed. Scoped to a PR's
          own diff the same repo finished in 109s. Also the better signal: it
          asks "are these new lines tested", not "is the whole crate perfect".
          Ignored on non-pull_request events, which have no base to diff.
        required: false
        type: boolean
        default: false
    outputs:
      mutation-score:
        description: 'Achieved mutation score (integer, 0–100)'
        value: ${{ jobs.mutation.outputs.score }}
    secrets:
      PRIVATE_DEPS_TOKEN:
        description: "Token with read access to private git-dependency repos (e.g. FLEET_READ_TOKEN). Optional — omit if the workspace has no private cargo git deps."
        required: false

jobs:
  mutation:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Mutation score (cargo-mutants)
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      score: ${{ steps.score.outputs.score }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CARGO_BUILD_JOBS: ${{ inputs.cargo-build-jobs }}

    steps:
      # fetch-depth 0 only when --in-diff needs a merge-base. Note the quoted
      # '0'/'1': GitHub expressions treat the NUMBER 0 as falsy, so the
      # unquoted form `inputs.in-diff && 0 || 1` silently evaluates to 1 and
      # the shallow clone breaks the merge-base lookup.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ inputs.in-diff && '0' || '1' }}

      - name: Configure git for private cargo dependencies
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$PRIVATE_DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            # cargo's libgit2 backend does not reliably honor url.insteadOf
            # credential rewriting; force it to shell out to system git,
            # which does.
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi

      - name: Install Rust (${{ inputs.toolchain }})
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: "${{ inputs.working-directory }} -> target"

      # Disk-safety net (not a policy gate): mutants-args defaulting to ''
      # mutates the whole workspace, which has filled CI disk before on
      # multi-crate repos. This only warns — it never fails the job — because
      # some callers may be intentionally relying on today's unscoped
      # behavior mid-rollout. The actual policy fix (adding -p <crate> at
      # each caller) is a separate, per-repo change.
      - name: Warn on unscoped mutation testing (multi-crate workspace)
        env:
          MUTANTS_ARGS: ${{ inputs.mutants-args }}
        run: |
          set -euo pipefail

          # Scoped callers (-p <crate>, --file, etc.) are exempt regardless
          # of workspace shape.
          if [[ -n "${MUTANTS_ARGS// /}" ]]; then
            exit 0
          fi

          if [[ ! -f Cargo.toml ]] || ! grep -q '^\[workspace\]' Cargo.toml; then
            exit 0  # single-crate repo — unscoped mutation covers only itself
          fi

          member_count=0
          if command -v cargo >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
            member_count=$(cargo metadata --no-deps --format-version=1 2>/dev/null \
              | jq '.workspace_members | length' 2>/dev/null || echo 0)
          fi
          if [[ -z "$member_count" || "$member_count" -eq 0 ]]; then
            # Fallback when cargo metadata/jq are unavailable: count quoted
            # path entries inside the `members = [...]` array text directly.
            members_block=$(awk '/members[[:space:]]*=/{flag=1} flag{print; if (/\]/) exit}' Cargo.toml)
            member_count=$(grep -oE '"[^"]+"' <<< "$members_block" | wc -l || echo 0)
          fi

          if [[ "$member_count" -gt 1 ]]; then
            echo "::warning title=Unscoped cargo-mutants run::mutants-args is empty ('') and this workspace declares ${member_count} member(s). The default mutates the ENTIRE workspace, which has filled CI disk before on multi-crate repos. Pass mutants-args: '-p <crate-name>' (or run one job per crate) to scope this run."
          fi

      # Prebuilt binary (no from-source compile per run) — matching what
      # rust-coverage/rust-test/rust-deny/rust-integration-coverage already do.
      #
      # This is load-bearing on the self-hosted fleet, not just a speedup:
      # `cargo install <tool> --locked` compiles a large crate graph inside the
      # runner pod, and the ci-light tier is capped at 2Gi. That OOM-kills the
      # pod mid-step — confirmed 2026-08-19 on ffreis-job-arbiter PR #61, where
      # `security / audit` died with "Install cargo-audit" never completing and
      # job_pod_terminated_total{reason="OOMKilled"} recording the kill for that
      # exact pod. Mutation would have hit the identical wall.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2.81.3
        with:
          tool: cargo-mutants

      # Establish a baseline — avoids counting slow clean-build time as test time.
      - name: Baseline test run
        run: |
          set -euo pipefail
          cargo test --all-features 2>&1 | tail -5

      # cargo-mutants requires the diff to apply cleanly to the CURRENT tree —
      # it aborts with "Diff content doesn't match source file" otherwise. So:
      # three-dot (merge-base) diff, computed on the PR head, against a
      # full-history checkout.
      - name: Compute PR diff for --in-diff
        id: diff
        if: ${{ inputs.in-diff && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DIFF_PATH: ${{ runner.temp }}/pr.diff
        run: |
          set -euo pipefail

          base=""
          for candidate in "origin/${BASE_REF}" "${BASE_REF}"; do
            if git rev-parse --verify --quiet "$candidate" >/dev/null 2>&1; then
              base="$candidate"
              break
            fi
          done
          if [[ -z "$base" ]]; then
            echo "::error title=Mutation diff error::cannot resolve base ref '${BASE_REF}'. Ensure the checkout used fetch-depth: 0."
            exit 1
          fi

          git diff "${base}...HEAD" -- '*.rs' > "$DIFF_PATH"

          if [[ ! -s "$DIFF_PATH" ]]; then
            echo "result=empty" >> "$GITHUB_OUTPUT"
            echo "::notice title=Mutation skipped::This PR changes no Rust source, so there is nothing to mutate."
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
            echo "Mutating only lines changed by this PR ($(grep -c '^+++' "$DIFF_PATH") changed .rs file(s))."
          fi

      - name: Run mutation testing
        id: run
        if: ${{ steps.diff.outputs.result != 'empty' }}
        env:
          MUTATION_JOBS: ${{ inputs.jobs }}
          MUTANTS_ARGS: ${{ inputs.mutants-args }}
          IN_DIFF: ${{ steps.diff.outputs.result == 'ok' && format('{0}/pr.diff', runner.temp) || '' }}
        run: |
          set -euo pipefail

          read -r -a mutants_args_arr <<< "${MUTANTS_ARGS:-}"

          in_diff_args=()
          if [[ -n "${IN_DIFF:-}" ]]; then
            in_diff_args=(--in-diff "$IN_DIFF")
          fi

          # DO NOT pass `--output mutants.out`. cargo-mutants treats --output as
          # the PARENT directory and creates <parent>/mutants.out inside it, so
          # that spelling wrote results to mutants.out/mutants.out/*.txt while
          # the scorer below read mutants.out/*.txt. Every count came back 0,
          # which the old "total == 0 -> pass" branch reported as a clean 100%.
          # The gate therefore could not fail on ANY consumer repo. The default
          # output location is already ./mutants.out — which is what the scorer
          # and the artifact upload both expect. Verified 2026-08-19 against
          # cargo-mutants 27.1.0.
          #
          # Exit code 0 = all caught, 2 = missed, 3 = timeout, 4 = error. It is
          # swallowed so the scorer owns the pass/fail decision (it must run on
          # partial results too); the scorer hard-fails when no outcome files
          # exist, so a crashed run can no longer slip through as a pass.
          cargo mutants \
            --jobs "$MUTATION_JOBS" \
            "${in_diff_args[@]}" \
            "${mutants_args_arr[@]}" \
            2>&1 || true

      - name: Compute score and enforce threshold
        id: score
        if: ${{ steps.diff.outputs.result != 'empty' }}
        env:
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          set -euo pipefail

          threshold="${THRESHOLD:-}"
          if [[ -z "$threshold" ]]; then
            echo "::error::threshold input is required"
            exit 1
          fi

          # Absence of evidence is NOT evidence of success. If cargo-mutants
          # wrote no outcome files at all, the harness is broken (wrong path,
          # crashed run, bad args) — fail loudly instead of reporting a clean
          # score for a run that measured nothing. This distinction is the
          # whole bug: the previous version could not tell "ran, found nothing
          # to mutate" from "never produced results", and called both a pass.
          if [[ ! -d mutants.out ]]; then
            echo "::error title=Mutation harness error::mutants.out/ does not exist — cargo-mutants did not write its outcomes where the scorer looked. This is a harness bug, not a passing run."
            exit 1
          fi

          have_outcomes=0
          for f in caught.txt missed.txt unviable.txt timeout.txt; do
            if [[ -f "mutants.out/${f}" ]]; then
              have_outcomes=1
              break
            fi
          done
          if [[ "$have_outcomes" -eq 0 ]]; then
            echo "::error title=Mutation harness error::no cargo-mutants outcome files (caught/missed/unviable/timeout.txt) under mutants.out/. Refusing to report a passing score for a run that produced no evidence."
            ls -la mutants.out || true
            exit 1
          fi

          count_lines() {
            if [[ -f "$1" ]]; then
              grep -c . "$1" 2>/dev/null || true
            else
              echo 0
            fi
          }

          caught=$(count_lines mutants.out/caught.txt);     caught=${caught:-0}
          missed=$(count_lines mutants.out/missed.txt);     missed=${missed:-0}
          timed_out=$(count_lines mutants.out/timeout.txt); timed_out=${timed_out:-0}
          unviable=$(count_lines mutants.out/unviable.txt); unviable=${unviable:-0}

          # Unviable mutants (the mutation does not compile) are excluded from
          # the score deliberately: no test could ever have caught them.
          total=$(( caught + missed ))
          echo "Caught: ${caught}  Missed: ${missed}  Timeout: ${timed_out}  Unviable: ${unviable}"

          if [[ "$total" -eq 0 ]]; then
            # Reached only with real outcome files present — e.g. an --in-diff
            # run whose diff touched no mutable code.
            echo "::notice title=Mutation Score::cargo-mutants ran and found no viable mutants (unviable: ${unviable}) — nothing to score."
            echo "score=100" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          score=$(( caught * 100 / total ))
          echo "score=${score}" >> "$GITHUB_OUTPUT"
          echo "Score: ${score}%  Threshold: ${threshold}%"

          if [[ "$score" -lt "$threshold" ]]; then
            echo "::error title=Mutation Score Too Low::Score ${score}% is below threshold ${threshold}%. Caught ${caught}/${total} mutants. Add tests that exercise more code paths."
            echo "Surviving mutants:"
            head -20 mutants.out/missed.txt || true
            exit 1
          fi

          echo "::notice title=Mutation Score OK::Score ${score}% ≥ threshold ${threshold}% (${caught}/${total} mutants caught)."

      # Upload missed/timeout mutant lists to make actionable findings visible.
      - name: Upload mutants output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-report
          path: ${{ inputs.working-directory }}/mutants.out/
          retention-days: 7
          if-no-files-found: ignore

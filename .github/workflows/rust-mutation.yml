name: Rust Mutation Testing

# Reusable workflow — callers invoke via:
#   uses: ./.github/workflows/rust-mutation.yml
#
# Intended schedule: weekly (Sunday 02:00 UTC) or workflow_dispatch.
# Do NOT run on every PR — mutation testing is slow (15–90 min per repo).
#
# Exit behaviour:
#   - exit 0  → mutation score ≥ threshold   (pass)
#   - exit 1  → mutation score  < threshold  (fail CI)
#
# Job topology (sharding, added 2026-08-23): `mutation` is a matrix over
# `shard-count` shards (default 4 — see that input for the evidence). Each
# shard independently discovers the same mutant set (`cargo mutants --shard
# k/n`) and uploads its own outcome files as artifact
# `mutants-report-shard-<k>`. A separate `mutation-aggregate` job downloads
# every shard's artifact, sums caught/missed/timeout/unviable across ALL of
# them, and enforces `threshold` exactly ONCE against the combined total —
# never per shard, so a shard boundary can never let a below-threshold crate
# through and can never fail a shard for mutants that live entirely in a
# different shard. `outputs.mutation-score` is sourced from that aggregate
# job, not from any individual shard.
#
# IMPORTANT — what sharding is (and is not) fixing here. This fleet's
# self-hosted "heavy" runner class — where this job runs by default, see the
# `runner` input — is capped at max_replicas: 1
# (platform/ffreis-home-infra ansible role job_arbiter, `ci-build` class;
# a second replica was tried and left Pending/unschedulable against measured
# free node memory, the same trap the xl-tier mistake documented on `runner`
# fell into). That means shards do NOT run in parallel on this fleet — they
# queue on, and run one at a time on, the single heavy pod. So sharding here
# is a JOB-SIZE fix only: it guarantees no single job can run past
# `timeout-minutes` or get silently killed mid-run by job-arbiter's 90-min
# stale-job reaper. It is NOT a wall-clock fix — splitting one crate's
# mutation run N ways costs roughly N× the fixed per-shard overhead
# (checkout, toolchain install, baseline test run) for zero parallelism
# benefit under today's capacity, and can make the total gate SLOWER.
# The lever that actually reduces wall-clock (scoping the WORK, not just
# redistributing it across more same-size jobs) is the `in-diff` input,
# below — prefer that for PR-triggered runs; reserve a wide shard-count for
# the full/scheduled sweep that recovers whole-crate coverage.
#
# `mutants-fail-fast` (added after 2026-08-29, still unreleased as of this
# comment): strategy.fail-fast for the shard matrix, default false. On a
# capacity-constrained pool like this fleet's serial "heavy" tier above, a
# genuine infra fault in one shard otherwise still burns the remaining
# shards' full serial wall-clock before mutation-aggregate fails anyway —
# see that input's own description for when to flip it to true.

on:
  workflow_call:
    inputs:
      toolchain:
        description: 'Rust toolchain to use'
        required: false
        type: string
        default: 'stable'
      working-directory:
        description: 'Directory containing Cargo.toml (workspace or package root)'
        required: false
        type: string
        default: '.'
      threshold:
        description: 'Minimum mutation score (0–100). CI fails if caught% is below this.'
        required: false
        type: number
        default: 60
      jobs:
        description: 'Parallel mutant workers (each worker builds + tests one mutant)'
        required: false
        type: number
        default: 4
      mutants-args:
        description: >-
          Extra flags passed verbatim to cargo mutants. WARNING: the default
          ('') is UNSCOPED — it mutates the ENTIRE cargo workspace, not just
          one crate. On a multi-crate workspace this has filled CI disk
          before. Callers with more than one crate MUST pass '-p
          <crate-name>' (or run a matrix, one job per crate). This job prints
          a ::warning:: when it detects an unscoped run against a
          multi-member workspace, but does not fail the build for it.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: >-
          Per-shard job timeout in minutes. Default 85 — deliberately BELOW
          job-arbiter's 90-minute stale-job reaper
          (platform/ffreis-home-infra ansible role job_arbiter:
          `max_in_progress_duration_secs: 90 * 60`). A job that runs past
          its own timeout-minutes fails with a clear, attributable "the job
          has exceeded the maximum execution time of 85 minutes" message; a
          job that instead runs into job-arbiter's external reaper gets
          silently cancelled with no such message and reads as flaky infra
          rather than a real timeout. Keeping this strictly under 90
          guarantees GitHub's own timeout always wins that race. This is a
          ceiling, not a target — see `shard-count` for actually keeping
          typical runs well under the 60-minute goal.
        required: false
        type: number
        default: 85
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted heavy tier
          [self-hosted, local, heavy]. Pass '["ubuntu-latest"]' for
          GitHub-hosted.

          scan-fix(ci:oom): was [self-hosted, local] (the light tier, a 2Gi
          pod). cargo-mutants rebuilds the crate once per mutant and is the
          single most memory-hungry job in the fleet; on the 2Gi pod it
          exhausts memory, and because the GitHub runner agent shares the pod
          cgroup with the build, the agent itself gets OOM-killed before the
          job ever reaches "Compute score and enforce threshold". That
          surfaces as "the self-hosted runner lost communication with the
          server" with BlobNotFound job logs — not a mutation-score failure —
          and has repeatedly been misread as flaky network/infra rather than
          a resource-tier mismatch. Measured live: a light-tier run sat at
          1714Mi against its 2Gi limit.

          A first correction defaulted this to xl (8Gi), reasoning "xl fits
          cargo-mutants' actual footprint and scales to zero the same way
          light does" — WRONG: xl sits at 0 replicas because it is
          UNSCHEDULABLE, not idle. Its 8Gi pod cannot be admitted on either
          fleet node while light/heavy are already running (burst-node:
          9.71Gi allocatable, ~4.7Gi free; local-server: 7.58Gi allocatable,
          ~3.6Gi free — job-arbiter only schedules a class when a single node
          can hold it), so a job on xl queues forever instead of failing —
          worse than the OOM it replaced, since a queued job never surfaces
          as a failure. heavy (3Gi) is 50% headroom over the 2Gi that OOM'd
          and IS schedulable alongside light/heavy on either node — evidence
          it's enough: ffreis-job-arbiter's mutation job PASSED on the 2Gi
          light tier, only ffreis-cluster-warden's failed there, so the real
          requirement sits between 2Gi and something modest, not 8Gi.
          Callers that already pass an explicit `runner:` (e.g. `light`) are
          unaffected by this default change.
        required: false
        type: string
        default: '["self-hosted","local","heavy"]'
      cargo-profile-debug:
        description: >-
          Sets CARGO_PROFILE_DEV_DEBUG — the dev profile's `debug` level, which
          the test profile inherits, so one value covers build and test.

          Default "line-tables-only" keeps panic backtraces (file/line still
          resolve) while dropping full DWARF, which is the single largest
          consumer of rustc and linker memory. Measured on ffreis-job-arbiter
          under a cgroup mirroring the runner pod, `cargo test --no-run`,
          jobs=2: 1931 MiB full debuginfo -> 1554 MiB line-tables-only, a 20%
          cut, with NO throughput cost.

          For contrast, capping parallelism — the knob this fleet has been
          tuning — bought 3% on the same build (jobs=1: 1872 MiB) while halving
          build concurrency, because peak is set by the single largest
          compilation unit, not by how many run at once. That is also why
          `cargo-build-jobs: 1` did not rescue ffreis-rust-shared at 2541 MB
          (99% of the 2.5Gi heavy tier) as this file's other comment records.

          Coverage is unaffected: cargo-llvm-cov uses instrumentation profiles,
          not DWARF. Verified byte-identical on ffreis-job-arbiter — 88.44%
          line / 87.35% region with and without.

          Pass "full" to restore complete debug info (a debugger or core-dump
          workflow), or "0" for the smallest possible footprint if you do not
          need backtraces.
        required: false
        type: string
        default: "line-tables-only"
      cargo-build-jobs:
        description: >-
          Caps CARGO_BUILD_JOBS (parallel rustc compile units).
          Default "auto" — derived from the runner pod's real cgroup memory
          limit at job start, so a tier resize cannot silently over-commit
          callers. Pass an explicit number to override (it always wins).

          Was "4", documented as memory-safe on a 4.5Gi self-hosted pod. That
          figure went stale — the heavy tier was resized 4.5Gi -> 2Gi -> 2.25Gi
          -> 2.5Gi -> 3Gi and this comment was never updated, so callers
          inheriting it were silently over-committed. Deriving it is what stops
          that recurring. The symptom is not a build failure: the runner agent
          shares the pod cgroup, so IT dies, surfacing as "the self-hosted
          runner lost communication with the server" with no logs.

          Measured on ffreis-rust-shared under a cgroup mirroring the heavy pod
          (MemoryMax=2560M, no swap, 2 CPU): peak anon 2541 MB at jobs=1 —
          99% of the limit before any parallelism. Memory is therefore
          dominated by a per-crate baseline, not linear in job count; a crate
          whose baseline alone exceeds the pod needs a bigger tier, not a
          smaller cap. Hosted-runner callers with real memory can pass a
          higher value (e.g. the runner's core count).
        type: string
        default: "auto"
      in-diff:
        description: >-
          On pull_request events, mutate ONLY the lines this PR changed
          (cargo-mutants --in-diff) instead of the whole crate. Strongly
          recommended for any crate big enough that a full run cannot finish
          inside timeout-minutes: ffreis-job-arbiter has 987 mutants against a
          ~28s test suite, which at 4 workers is ~123 min versus the 90 min
          default timeout — so its gate never once completed. Scoped to a PR's
          own diff the same repo finished in 109s. Also the better signal: it
          asks "are these new lines tested", not "is the whole crate perfect".
          Ignored on non-pull_request events, which have no base to diff.
        required: false
        type: boolean
        default: false
      shard-count:
        description: >-
          Number of matrix shards to split mutation testing across
          (cargo-mutants --shard k/n). Default 4.

          Evidence for the default: the `in-diff` input above records
          ffreis-job-arbiter's crate at 987 mutants, estimated ~123 min for
          a full unscoped run at this workflow's own default `jobs` worker
          count (4) — past both the 60-min goal and (with any variance) the
          90-min job-arbiter reaper. 123 min / 4 shards ≈ 31 min of actual
          mutation-testing compute per shard; this job already installs a
          prebuilt cargo-mutants binary (taiki-e/install-action, not a
          from-source `cargo install`) and uses Swatinem/rust-cache, so the
          fixed per-shard overhead on top of that is on the order of a few
          minutes — landing comfortably under 60 min per shard with real
          margin for a bigger or slower crate than the one measured.

          Deliberately NOT higher. cargo-mutants' own docs suggest 8-32
          shards as a starting point, but that assumes real parallel runner
          capacity. This fleet's self-hosted "heavy" class is capped at
          max_replicas: 1 (see the job-topology note at the top of this
          file) — shards queue and run SERIALLY on the one pod, so every
          extra shard adds another full round of fixed overhead (checkout,
          toolchain install, baseline test run) to the total wall-clock for
          the whole gate, for zero parallelism benefit today. 4 is the
          smallest shard count that comfortably clears the worst crate
          measured so far; raising the default further would trade more
          overhead for headroom this fleet currently has no spare runner
          capacity to spend faster. (Raising `ci-build`'s max_replicas would
          change that trade — that is a live-cluster capacity decision, out
          of scope for this file.)

          Override UP for a crate known to be bigger than 987 mutants.
          Override DOWN to 1 for small/typical crates (most of the fleet) —
          a small crate sharded 4 ways pays 4x the fixed overhead for work
          that would finish in a couple of minutes unsharded. On a
          pull_request event with `in-diff` active, this workflow already
          collapses to 1 shard automatically regardless of this input (a
          diff-scoped PR run is typically a handful of mutants — see
          `shard-plan` below) — no override needed for that case.
        required: false
        type: number
        default: 4
      mutants-fail-fast:
        description: >-
          strategy.fail-fast for the shard matrix (see `shard-count`).
          Default false, matching cargo-mutants' own upstream CI example
          ("collect all mutants even if some are missed" —
          https://github.com/sourcefrog/cargo-mutants/blob/main/examples/workflows/sharded.yml):
          a shard's own job status only reflects a genuine harness/build
          failure, never a missed mutant (missed-mutant exit codes are
          swallowed — see the "Guard against a silent harness failure"
          step), so leaving this false costs nothing on the common path and
          guarantees mutation-aggregate always sees every shard's data
          before it decides pass/fail.

          Consider true for a caller whose runner pool is capacity-
          constrained enough that shards effectively queue and run
          SERIALLY rather than in parallel (see the job-topology note at
          the top of this file — this fleet's own "heavy" tier is exactly
          this case, capped at max_replicas: 1). There, a genuine infra
          fault in shard 0 wastes real serial wall-clock finishing shards
          1..N-1 before mutation-aggregate fails anyway on "at least one
          shard did not succeed" — cancelling the rest early via
          fail-fast: true recovers that time. Less useful on a pool with
          real parallel capacity, where the other shards finish at roughly
          the same time regardless of whether one was cancelled.
        required: false
        type: boolean
        default: false
    outputs:
      mutation-score:
        description: 'Achieved mutation score (integer, 0–100), summed across all shards.'
        value: ${{ jobs.mutation-aggregate.outputs.score }}
    secrets:
      PRIVATE_DEPS_TOKEN:
        description: "Token with read access to private git-dependency repos (e.g. FLEET_READ_TOKEN). Optional — omit if the workspace has no private cargo git deps."
        required: false

jobs:
  shard-plan:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Plan mutation shards
    # Cheap jq/seq arithmetic — always GitHub-hosted regardless of `runner`,
    # so this never consumes self-hosted fleet capacity.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - name: Compute effective shard count and matrix
        id: plan
        env:
          REQUESTED_SHARDS: ${{ inputs.shard-count }}
          # A pull_request run that in-diff is actually going to scope is
          # typically a handful of mutants (see the `in-diff` input) —
          # sharding that pays N x the fixed per-shard overhead for a job
          # that finishes in well under a minute unsharded. Collapse to 1
          # shard whenever in-diff will actually apply; every other trigger
          # (schedule, workflow_dispatch, push) and any pull_request run
          # with in-diff off keeps the caller's requested shard-count.
          IN_DIFF_ACTIVE: ${{ inputs.in-diff && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail

          if [[ "${IN_DIFF_ACTIVE}" == "true" ]]; then
            total=1
            why="in-diff is scoping this pull_request run to its own diff"
          else
            total="${REQUESTED_SHARDS}"
            why="shard-count input"
          fi

          if ! [[ "$total" =~ ^[0-9]+$ ]] || [[ "$total" -lt 1 ]]; then
            echo "::error title=Invalid shard-count::shard-count must resolve to a positive integer, got '${total}'."
            exit 1
          fi

          shards=$(seq 0 $((total - 1)) | jq -R 'tonumber' | jq -cs .)
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "Mutation shards: ${total} (${why})"

  mutation:
    needs: shard-plan
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Mutation score (cargo-mutants)
    strategy:
      fail-fast: ${{ inputs.mutants-fail-fast }}
      matrix:
        shard: ${{ fromJson(needs.shard-plan.outputs.shards) }}
    # PUBLIC repos are FORCED onto GitHub-hosted runners, overriding `runner`.
    # A public repo accepts pull requests from forks, and a self-hosted runner
    # executing fork-authored code would run arbitrary code on the homelab
    # cluster — GitHub documents this as unsafe, and it is the one case where
    # honouring the caller's input would be wrong. Private repos keep whatever
    # `runner` says (default: the self-hosted local cluster).
    #
    # `github.event.repository.visibility` is populated for every trigger type
    # this workflow supports — same mechanism ffreis-workflows-terraform's
    # tf-sonar.yml already uses to route private repos to the local SonarQube.
    runs-on: ${{ github.event.repository.visibility == 'public' && fromJson('["ubuntu-latest"]') || fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      # Keep rustup's home OFF the image's overlay lower layer.
      #
      # The runner image bakes a toolchain at /usr/local/rustup. When CI asks
      # for `stable` and upstream has moved, rustup tries to REPLACE the baked
      # components, which means renaming a directory that lives in a lower
      # overlayfs layer — and overlayfs answers EXDEV ("Invalid cross-device
      # link") for exactly that. rustup then rolls back and exits 1:
      #
      #   error: could not rename 'component' file from
      #   '/usr/local/rustup/toolchains/stable-.../share/doc/clippy'
      #   to '/usr/local/rustup/tmp/...': Invalid cross-device link (os error 18)
      #
      # It looks intermittent because a pod that survives one successful
      # update has copied-up and never fails again — only FRESH pods break. So
      # it surfaces after any Deployment roll, and `toolchain: 1.88.0` (the
      # MSRV, which matches what is baked) keeps passing while `stable` fails.
      #
      # Pointing RUSTUP_HOME at a writable path makes the install FRESH rather
      # than a replace, so no lower-layer rename happens. Cost: a minimal
      # toolchain download per pod (the action already passes
      # `--profile minimal`). That is the deliberate trade — a predictable
      # ~30-60s against a failure that is invisible until it isn't.
      #
      # The PATH MATTERS, and /tmp is the wrong one. In this fleet's runner
      # pods /tmp is an emptyDir with `sizeLimit: 2Gi`, and a toolchain is
      # ~2Gi — so a first attempt at this evicted the pod outright:
      #   Evicted: Usage of EmptyDir volume "tmp" exceeds the limit "2Gi"
      # which surfaces, again, as "the self-hosted runner lost communication".
      # /home/runner/_work is the `work` emptyDir at 8Gi, the only mount with
      # room. It is shared with the build's target/ dir, so a repo whose
      # target/ approaches 6Gi will need that limit raised rather than this
      # path changed.
      #
      # It also means CI no longer depends on the image's baked toolchain at
      # all, which is the answer to "should the image bake one?": it should
      # not, and this is what makes removing it safe.
      RUSTUP_HOME: /home/runner/_work/_temp/rustup-ci
      CARGO_PROFILE_DEV_DEBUG: ${{ inputs.cargo-profile-debug }}

    steps:
      # Resolve build parallelism BEFORE anything invokes cargo.
      #
      # This step is the single authority: a $GITHUB_ENV write beats both a
      # job-level `env:` and the value inherited from the runner pod's
      # container env (both measured on a real runner, 2026-08-21). So no
      # `CARGO_BUILD_JOBS` is declared at job level any more — if this step
      # were ever skipped, the pod's own value applies, which is a safe
      # fallback rather than an unset variable.
      #
      # `auto` derives the cap from the pod's REAL cgroup memory limit, so a
      # tier resize no longer silently over-commits every caller. That is the
      # failure this replaces: the previous constant ("4", documented as
      # memory-safe on a 4.5Gi pod) was never updated as the tier went
      # 4.5Gi -> 2Gi -> 2.25Gi -> 2.5Gi -> 3Gi, and the symptom is not a build
      # error — the runner agent shares the pod cgroup, so IT dies and the job
      # surfaces as "the self-hosted runner lost communication" with no logs.
      #
      # ~1 GiB per compile unit is deliberately conservative and is a CEILING,
      # not a target: measured peak on ffreis-rust-shared was 2541 MB at
      # jobs=1 (99% of a 2560M limit), i.e. memory is dominated by a
      # per-crate baseline rather than being linear in job count. No formula
      # can rescue a crate whose baseline alone exceeds the pod — those pass
      # an explicit number, which always wins over `auto`.
      - name: Resolve build parallelism
        # Pinned to the workspace root: this step runs BEFORE checkout, so the
        # job's default working-directory (the caller's `working-directory`
        # input, e.g. examples/hello) does not exist yet and bash cannot even
        # start. Caught by CI on the first run of this change.
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED: ${{ inputs.cargo-build-jobs }}
        run: |
          set -euo pipefail
          if [ "${REQUESTED}" != "auto" ]; then
            echo "CARGO_BUILD_JOBS=${REQUESTED}" >> "$GITHUB_ENV"
            echo "build parallelism: ${REQUESTED} (explicit caller override)"
            exit 0
          fi
          # The path is a seam so this can be tested against fixtures — the
          # workspace's "inject IO, never real IO in a tested path" rule.
          # Production never sets it.
          limit="$(cat "${CGROUP_MEMORY_MAX_PATH:-/sys/fs/cgroup/memory.max}" 2>/dev/null || echo max)"
          cpus="$(nproc 2>/dev/null || echo 2)"
          # "max" means unlimited (hosted runners, or cgroup v1 layouts where
          # this file is absent). Never guess a big number from an unreadable
          # limit — fall back to the value this input used to hardcode.
          if [ "${limit}" = "max" ] || ! printf '%s' "${limit}" | grep -qE '^[0-9]+$'; then
            jobs=2
            why="cgroup limit unreadable or unlimited; safe fallback"
          else
            gib=$(( limit / 1073741824 ))
            [ "${gib}" -lt 1 ] && gib=1
            jobs="${gib}"
            [ "${jobs}" -gt "${cpus}" ] && jobs="${cpus}"
            why="${gib}GiB pod memory limit, ${cpus} cpu"
          fi
          echo "CARGO_BUILD_JOBS=${jobs}" >> "$GITHUB_ENV"
          echo "build parallelism: ${jobs} (${why})"

      # fetch-depth 0 only when --in-diff needs a merge-base. Note the quoted
      # '0'/'1': GitHub expressions treat the NUMBER 0 as falsy, so the
      # unquoted form `inputs.in-diff && 0 || 1` silently evaluates to 1 and
      # the shallow clone breaks the merge-base lookup.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ inputs.in-diff && '0' || '1' }}

      - name: Configure git for private cargo dependencies
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$PRIVATE_DEPS_TOKEN" ]]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            # cargo's libgit2 backend does not reliably honor url.insteadOf
            # credential rewriting; force it to shell out to system git,
            # which does.
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi

      - name: Install Rust (${{ inputs.toolchain }})
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: "${{ inputs.working-directory }} -> target"

      # Disk-safety net (not a policy gate): mutants-args defaulting to ''
      # mutates the whole workspace, which has filled CI disk before on
      # multi-crate repos. This only warns — it never fails the job — because
      # some callers may be intentionally relying on today's unscoped
      # behavior mid-rollout. The actual policy fix (adding -p <crate> at
      # each caller) is a separate, per-repo change.
      - name: Warn on unscoped mutation testing (multi-crate workspace)
        # Identical on every shard (same workspace, same mutants-args) —
        # only emit it once so N shards don't repeat the same annotation.
        if: ${{ matrix.shard == 0 }}
        env:
          MUTANTS_ARGS: ${{ inputs.mutants-args }}
        run: |
          set -euo pipefail

          # Scoped callers (-p <crate>, --file, etc.) are exempt regardless
          # of workspace shape.
          if [[ -n "${MUTANTS_ARGS// /}" ]]; then
            exit 0
          fi

          if [[ ! -f Cargo.toml ]] || ! grep -q '^\[workspace\]' Cargo.toml; then
            exit 0  # single-crate repo — unscoped mutation covers only itself
          fi

          member_count=0
          if command -v cargo >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
            member_count=$(cargo metadata --no-deps --format-version=1 2>/dev/null \
              | jq '.workspace_members | length' 2>/dev/null || echo 0)
          fi
          if [[ -z "$member_count" || "$member_count" -eq 0 ]]; then
            # Fallback when cargo metadata/jq are unavailable: count quoted
            # path entries inside the `members = [...]` array text directly.
            members_block=$(awk '/members[[:space:]]*=/{flag=1} flag{print; if (/\]/) exit}' Cargo.toml)
            member_count=$(grep -oE '"[^"]+"' <<< "$members_block" | wc -l || echo 0)
          fi

          if [[ "$member_count" -gt 1 ]]; then
            echo "::warning title=Unscoped cargo-mutants run::mutants-args is empty ('') and this workspace declares ${member_count} member(s). The default mutates the ENTIRE workspace, which has filled CI disk before on multi-crate repos. Pass mutants-args: '-p <crate-name>' (or run one job per crate) to scope this run."
          fi

      # Prebuilt binary (no from-source compile per run) — matching what
      # rust-coverage/rust-test/rust-deny/rust-integration-coverage already do.
      #
      # This is load-bearing on the self-hosted fleet, not just a speedup:
      # `cargo install <tool> --locked` compiles a large crate graph inside the
      # runner pod, and the ci-light tier is capped at 2Gi. That OOM-kills the
      # pod mid-step — confirmed 2026-08-19 on ffreis-job-arbiter PR #61, where
      # `security / audit` died with "Install cargo-audit" never completing and
      # job_pod_terminated_total{reason="OOMKilled"} recording the kill for that
      # exact pod. Mutation would have hit the identical wall.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2.81.3
        with:
          tool: cargo-mutants

      # Establish a baseline — avoids counting slow clean-build time as test time.
      - name: Baseline test run
        run: |
          set -euo pipefail
          cargo test --all-features 2>&1 | tail -5

      # cargo-mutants requires the diff to apply cleanly to the CURRENT tree —
      # it aborts with "Diff content doesn't match source file" otherwise. So:
      # three-dot (merge-base) diff, computed on the PR head, against a
      # full-history checkout.
      - name: Compute PR diff for --in-diff
        id: diff
        if: ${{ inputs.in-diff && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DIFF_PATH: ${{ runner.temp }}/pr.diff
        run: |
          set -euo pipefail

          base=""
          for candidate in "origin/${BASE_REF}" "${BASE_REF}"; do
            if git rev-parse --verify --quiet "$candidate" >/dev/null 2>&1; then
              base="$candidate"
              break
            fi
          done
          if [[ -z "$base" ]]; then
            echo "::error title=Mutation diff error::cannot resolve base ref '${BASE_REF}'. Ensure the checkout used fetch-depth: 0."
            exit 1
          fi

          git diff "${base}...HEAD" -- '*.rs' > "$DIFF_PATH"

          if [[ ! -s "$DIFF_PATH" ]]; then
            echo "result=empty" >> "$GITHUB_OUTPUT"
            echo "::notice title=Mutation skipped::This PR changes no Rust source, so there is nothing to mutate."
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
            echo "Mutating only lines changed by this PR ($(grep -c '^+++' "$DIFF_PATH") changed .rs file(s))."
          fi

      - name: Run mutation testing
        id: run
        if: ${{ steps.diff.outputs.result != 'empty' }}
        env:
          MUTATION_JOBS: ${{ inputs.jobs }}
          MUTANTS_ARGS: ${{ inputs.mutants-args }}
          IN_DIFF: ${{ steps.diff.outputs.result == 'ok' && format('{0}/pr.diff', runner.temp) || '' }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ needs.shard-plan.outputs.total }}
        run: |
          set -euo pipefail

          read -r -a mutants_args_arr <<< "${MUTANTS_ARGS:-}"

          in_diff_args=()
          if [[ -n "${IN_DIFF:-}" ]]; then
            in_diff_args=(--in-diff "$IN_DIFF")
          fi

          # Always passed, even at SHARD_TOTAL=1 ("shard 0 of 1" is a no-op —
          # every mutant belongs to the single shard). One code path for
          # both the sharded and unsharded case.
          shard_args=(--shard "${SHARD_INDEX}/${SHARD_TOTAL}")

          # --baseline skip only when actually sharded (SHARD_TOTAL > 1).
          # The "Baseline test run" step above already verifies the
          # unmutated crate passes once per shard job; skipping
          # cargo-mutants' OWN internal baseline avoids paying that same
          # verification a second time on every shard. Per
          # https://mutants.rs/shards.html: "if running with
          # --baseline=skip you must independently verify baseline tests
          # pass before sharding begins" — the step above satisfies that.
          # Left in place (cargo-mutants' own baseline still runs) for the
          # unsharded default path, to avoid changing that path's
          # long-standing behavior.
          baseline_args=()
          if [[ "${SHARD_TOTAL}" -gt 1 ]]; then
            baseline_args=(--baseline skip)
          fi

          # DO NOT pass `--output mutants.out`. cargo-mutants treats --output as
          # the PARENT directory and creates <parent>/mutants.out inside it, so
          # that spelling wrote results to mutants.out/mutants.out/*.txt while
          # the scorer below read mutants.out/*.txt. Every count came back 0,
          # which the old "total == 0 -> pass" branch reported as a clean 100%.
          # The gate therefore could not fail on ANY consumer repo. The default
          # output location is already ./mutants.out — which is what the scorer
          # and the artifact upload both expect. Verified 2026-08-19 against
          # cargo-mutants 27.1.0.
          #
          # Exit code 0 = all caught, 2 = missed, 3 = timeout, 4 = error. It is
          # swallowed so the scorer owns the pass/fail decision (it must run on
          # partial results too); the scorer hard-fails when no outcome files
          # exist, so a crashed run can no longer slip through as a pass.
          # The exit code is CAPTURED, not discarded, because the scorer needs
          # to tell two very different "no mutants.out/" cases apart:
          #   exit 0 + no output dir -> cargo-mutants ran and had nothing to
          #                             mutate (e.g. an --in-diff whose only
          #                             .rs changes are test files, which it
          #                             does not mutate). It prints
          #                             "No mutants to filter" and writes NO
          #                             directory at all. This is a PASS.
          #   non-0 + no output dir  -> it died before writing anything. This
          #                             is a harness error and must FAIL.
          # Without this, the scorer's own missing-evidence guard misfires on
          # a perfectly good run — observed on job-arbiter #65, whose only .rs
          # change was tests/mutation_score.rs.
          set +e
          cargo mutants \
            --jobs "$MUTATION_JOBS" \
            "${shard_args[@]}" \
            "${baseline_args[@]}" \
            "${in_diff_args[@]}" \
            "${mutants_args_arr[@]}" \
            2>&1
          mutants_rc=$?
          set -e
          echo "rc=${mutants_rc}" >> "$GITHUB_OUTPUT"
          echo "cargo-mutants exited ${mutants_rc}"

      # Per-shard: verify cargo-mutants left real evidence behind, or a
      # legitimate "nothing to mutate" — never a silent harness failure.
      # Threshold enforcement moved to the mutation-aggregate job below,
      # which is the only place that has ALL shards' outcomes to score
      # against; a per-shard threshold check would be meaningless (a shard
      # could easily hold 0 or 1 mutants) and could wrongly fail a shard for
      # mutants that live entirely in a different shard.
      - name: Guard against a silent harness failure
        id: guard
        if: ${{ steps.diff.outputs.result != 'empty' }}
        env:
          MUTANTS_RC: ${{ steps.run.outputs.rc }}
        run: |
          set -euo pipefail

          # Absence of evidence is NOT evidence of success. If cargo-mutants
          # wrote no outcome files at all, the harness is broken (wrong path,
          # crashed run, bad args) — fail loudly instead of letting the
          # aggregate job silently read this shard as "nothing to mutate".
          # This distinction is the whole bug this guard exists to prevent:
          # the original scorer could not tell "ran, found nothing to
          # mutate" from "never produced results", and called both a pass.
          #
          # But the mirror-image mistake is just as wrong, and the first
          # version of this guard made it: cargo-mutants writes NO directory
          # at all when it has nothing to mutate — an --in-diff whose only .rs
          # changes are test files prints "No mutants to filter" and exits 0.
          # Treating that as a harness error fails a perfectly good run.
          # Observed on job-arbiter #65 (only .rs change: tests/mutation_score.rs).
          # So the exit code, not the directory alone, is what separates them.
          # Same logic applies per-shard: a shard whose slice of the diff/
          # workspace has nothing mutable legitimately produces no output.
          if [[ ! -d mutants.out ]]; then
            if [[ "${MUTANTS_RC:-1}" == "0" ]]; then
              echo "::notice title=Mutation Score::shard ${{ matrix.shard }} ran and found nothing to mutate (exit 0, no outcome files)."
              exit 0
            fi
            echo "::error title=Mutation harness error::mutants.out/ does not exist on shard ${{ matrix.shard }} and cargo-mutants exited ${MUTANTS_RC:-unknown} — it died before writing any outcomes. This is a harness bug, not a passing run."
            exit 1
          fi

          have_outcomes=0
          for f in caught.txt missed.txt unviable.txt timeout.txt; do
            if [[ -f "mutants.out/${f}" ]]; then
              have_outcomes=1
              break
            fi
          done
          if [[ "$have_outcomes" -eq 0 ]]; then
            echo "::error title=Mutation harness error::no cargo-mutants outcome files (caught/missed/unviable/timeout.txt) under mutants.out/ on shard ${{ matrix.shard }}. Refusing to treat a run with no evidence as clean."
            ls -la mutants.out || true
            exit 1
          fi

          echo "Shard ${{ matrix.shard }} produced evidence — scoring deferred to the mutation-aggregate job."

      # Upload missed/timeout mutant lists to make actionable findings
      # visible, and so mutation-aggregate below can sum them. One artifact
      # name per shard — actions/upload-artifact v4 rejects duplicate names
      # within a run, and each matrix leg is a separate upload.
      - name: Upload mutants output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-report-shard-${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/mutants.out/
          retention-days: 7
          if-no-files-found: ignore

  mutation-aggregate:
    needs: [shard-plan, mutation]
    # always() so this still runs (and can report a clear failure) when a
    # shard failed — the default implicit `if: success()` would instead
    # skip straight past it and leave `outputs.mutation-score` empty, which
    # reads as "nothing measured" rather than "a shard broke". Gated on
    # shard-plan succeeding so a draft-PR skip (shard-plan itself skipped)
    # propagates to a skip here too, instead of a false failure.
    if: ${{ always() && needs.shard-plan.result == 'success' }}
    name: Mutation score (aggregate)
    # Only sums small text files across downloaded artifacts — always
    # GitHub-hosted, never consumes self-hosted fleet capacity.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      score: ${{ steps.score.outputs.score }}
    steps:
      - name: Fail fast if any shard did not succeed
        if: ${{ needs.mutation.result != 'success' }}
        run: |
          echo "::error title=Mutation harness error::at least one mutation shard did not succeed (result: ${{ needs.mutation.result }}). See the 'mutation' matrix jobs above for the specific shard and error. Not computing an aggregate score."
          exit 1

      - name: Download all shard reports
        if: ${{ needs.mutation.result == 'success' }}
        # Zero shard artifacts is a real, legitimate outcome (e.g. every
        # shard's --in-diff found nothing mutable) — never let a missing
        # artifact itself fail this job; the scoring step below decides
        # what an empty download means.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutants-report-shard-*
          path: downloaded

      - name: Compute aggregate score and enforce threshold
        id: score
        if: ${{ needs.mutation.result == 'success' }}
        env:
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          threshold="${THRESHOLD:-}"
          if [[ -z "$threshold" ]]; then
            echo "::error::threshold input is required"
            exit 1
          fi

          # Every shard already passed its own "Guard against a silent
          # harness failure" step (or this job would have failed fast
          # above) — so by this point, any shard with no output legitimately
          # had nothing to mutate. Summing zero real evidence across all
          # shards is therefore a genuine "nothing to score" outcome, not a
          # harness bug: same shape as the original single-job scorer's
          # own total==0 branch, just aggregated across N directories.
          count_lines() {
            local pattern="$1" total=0 f n
            for f in downloaded/mutants-report-shard-*/"${pattern}"; do
              n=$(grep -c . "$f" 2>/dev/null || true)
              total=$(( total + ${n:-0} ))
            done
            echo "$total"
          }

          caught=$(count_lines caught.txt)
          missed=$(count_lines missed.txt)
          timed_out=$(count_lines timeout.txt)
          unviable=$(count_lines unviable.txt)

          # Unviable mutants (the mutation does not compile) are excluded
          # from the score deliberately: no test could ever have caught them.
          total=$(( caught + missed ))
          echo "Caught: ${caught}  Missed: ${missed}  Timeout: ${timed_out}  Unviable: ${unviable} (summed across all shards)"

          if [[ "$total" -eq 0 ]]; then
            echo "::notice title=Mutation Score::no shard reported any caught/missed mutants — either every shard found nothing to mutate (e.g. an --in-diff run touching no mutable code) or unviable-only. Nothing to score; marking as passed."
            echo "score=100" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          score=$(( caught * 100 / total ))
          echo "score=${score}" >> "$GITHUB_OUTPUT"
          echo "Score: ${score}%  Threshold: ${threshold}%"

          if [[ "$score" -lt "$threshold" ]]; then
            echo "::error title=Mutation Score Too Low::Score ${score}% is below threshold ${threshold}%. Caught ${caught}/${total} mutants across all shards. Add tests that exercise more code paths."
            echo "Surviving mutants (first 20, across all shards):"
            cat downloaded/mutants-report-shard-*/missed.txt 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "::notice title=Mutation Score OK::Score ${score}% ≥ threshold ${threshold}% (${caught}/${total} mutants caught across all shards)."
